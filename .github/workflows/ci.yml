name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/investigations/go.mod
          cache-dependency-path: |
            apps/investigations/go.sum
            packages/contract/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Собрать и проверить спеку
        run: task spec

      # Главная защита от «забыл перегенерировать»: код генерируется заново
      # и сверяется с тем, что в PR. Любое расхождение — падение сборки.
      - name: Сгенерированный код соответствует спеке
        run: task check-generated

      - name: Сборка
        run: task build

      - name: go vet
        run: task vet

      # Ставим зависимости: без них клиент не проверить, а он тоже часть контракта.
      - name: Контракт для TypeScript компилируется
        working-directory: packages/contract-ts
        run: |
          npm install --no-audit --no-fund
          npm run typecheck

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: investigations
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Миграции применяются на чистую базу
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d investigations -v ON_ERROR_STOP=1 \
            -c 'CREATE SCHEMA IF NOT EXISTS inv;'
          for f in db/migrations/investigations/*.sql; do
            echo "applying $f"
            psql -h localhost -U postgres -d investigations -v ON_ERROR_STOP=1 -f "$f"
          done
