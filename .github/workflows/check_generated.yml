name: Check generated

on:
  pull_request:
    paths:
      - 'api/**'
      - 'packages/contract/**'
      - 'packages/contract-ts/**'
      - 'apps/investigations/internal/server/**'
      - 'apps/gateway/**'
      - 'Taskfile.yml'
      - '.github/workflows/check_generated.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'packages/contract/**'
      - 'packages/contract-ts/**'
      - 'apps/investigations/internal/server/**'
      - 'apps/gateway/**'
      - 'Taskfile.yml'
      - '.github/workflows/check_generated.yml'

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            apps/investigations/go.sum
            apps/gateway/go.sum
            packages/contract/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/contract-ts/package-lock.json

      - name: Set up Task
        uses: arduino/setup-task@v2

      - name: Install TypeScript dependencies
        run: npm ci --prefix packages/contract-ts

      - name: Check
        run: task check
