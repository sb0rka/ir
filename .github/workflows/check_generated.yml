name: Check generated

on:
  pull_request:
    paths:
      - 'api/**'
      - 'packages/contract/**'
      - 'packages/contract-ts/**'
      - 'apps/investigations/**'
      - 'db/migrations/investigations/**'
      - 'apps/gateway/**'
      - 'Taskfile.yml'
      - '.github/workflows/check_generated.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'packages/contract/**'
      - 'packages/contract-ts/**'
      - 'apps/investigations/**'
      - 'db/migrations/investigations/**'
      - 'apps/gateway/**'
      - 'Taskfile.yml'
      - '.github/workflows/check_generated.yml'

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: integration-tests-only
          POSTGRES_DB: ir_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d ir_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INVESTIGATIONS_TEST_DATABASE_URI: 'postgres://postgres:integration-tests-only@localhost:5432/ir_test?sslmode=disable&search_path=inv'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            apps/investigations/go.sum
            apps/gateway/go.sum
            packages/contract/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/contract-ts/package-lock.json

      - name: Set up Task
        uses: arduino/setup-task@v2

      - name: Install TypeScript dependencies
        run: npm ci --prefix packages/contract-ts

      - name: Prepare isolated integration database
        env:
          PGPASSWORD: integration-tests-only
        run: |
          for migration in 007-extensions 008-schema 009-version 010-initial_schema 901-seed_reference; do
            psql -h localhost -U postgres -d ir_test -v ON_ERROR_STOP=1 -v DB_INV_SCHEMA_NAME=inv -f "db/migrations/investigations/$migration.sql"
          done

      - name: Check (including database and HTTP/MCP runtime tests)
        run: task check
