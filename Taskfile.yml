version: '3'

# Запуск: task <имя>. Требует go-task (https://taskfile.dev).

vars:
  MODULE: github.com/sb0rka/ir/packages/contract
  SERVER_DIR: apps/investigations/internal/server
  REDOCLY: npx --yes @redocly/cli@latest
  CODEGEN: go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0
  IMPL: go run github.com/josharian/impl@v1.5.0
  GOIMPORTS: go run golang.org/x/tools/cmd/goimports@latest
  OPENAPI_TS: npx --yes openapi-typescript@7

tasks:
  default:
    cmds:
      - task --list

  gen:
    desc: Перегенерировать всё из api/ — одна команда на всю генерацию
    cmds:
      - task: spec
      - task: gen-prune
      - task: gen-go
      - task: gen-stubs
      - task: gen-ts
      - gofmt -w packages/contract {{.SERVER_DIR}}

  gen-prune:
    desc: Убрать сгенерированное для доменов, которых больше нет в api/paths
    cmds:
      # Генераторы только создают и перезаписывают. Без этого шага удаление
      # домена оставляет живой Go-пакет и .d.ts, которые компилируются,
      # импортируются и ничего не обслуживают.
      - cmd: |
          for dir in packages/contract/*/; do
            name=$(basename "$dir")
            [ "$name" = "spec" ] && continue
            [ -f "api/paths/$name.yaml" ] || { echo "убираю мёртвый домен: $name"; rm -rf "$dir"; }
          done
          for file in packages/contract-ts/domains/*.d.ts; do
            [ -e "$file" ] || continue
            name=$(basename "$file" .d.ts)
            [ -f "api/paths/$name.yaml" ] || { echo "убираю мёртвый домен: $name.d.ts"; rm -f "$file"; }
          done
          for file in {{.SERVER_DIR}}/*.go; do
            name=$(basename "$file" .go)
            [ "$name" = "server" ] && continue
            [ -f "api/paths/$name.yaml" ] || { echo "убираю мёртвые заготовки: $name.go"; rm -f "$file"; }
          done

  spec:
    desc: Собрать спеку и проверить
    cmds:
      - task: spec-domains
      - '{{.REDOCLY}} join api/openapi.yaml api/paths/*.yaml -o api/bundle.yaml --without-x-tag-groups'
      - '{{.REDOCLY}} lint api/bundle.yaml'

  spec-domains:
    desc: Развернуть каждый доменный файл в самостоятельный документ
    sources: ['api/paths/*.yaml']
    method: none
    cmds:
      # Каталог пересоздаётся, а не дополняется: иначе удалённый домен оставит
      # здесь свой файл, и gen-go с gen-ts будут вечно генерировать мёртвый
      # пакет — check-generated этого не заметит, потому что diff пустой.
      - cmd: rm -rf api/build && mkdir -p api/build
      - for: sources
        cmd: "{{.REDOCLY}} bundle '{{.ITEM}}' -o api/build/{{osBase .ITEM}}"

  gen-go:
    desc: Go-контракт — пакет на домен
    sources: ['api/build/*.yaml']
    method: none
    cmds:
      - for: sources
        cmd: >-
          cd packages/contract &&
          {{.CODEGEN}} -package {{trimSuffix ".yaml" (osBase .ITEM)}}
          -generate models,std-http-server,strict-server
          -o {{trimSuffix ".yaml" (osBase .ITEM)}}/{{trimSuffix ".yaml" (osBase .ITEM)}}.gen.go
          '../../{{.ITEM}}'
      - cd packages/contract && {{.CODEGEN}} -package spec -generate embedded-spec -o spec/spec.gen.go ../../api/bundle.yaml

  gen-stubs:
    desc: Заготовки для новых ручек
    sources: ['api/paths/*.yaml']
    method: none
    cmds:
      # Новый домен: impl дописывает в конец файла, но перед этим разбирает
      # весь пакет, а пустой файл без package-строки разбор роняет. Поэтому
      # заготовку заводим сами — иначе добавление домена требовало бы ручного
      # шага, которого в `task gen` быть не должно.
      - for: sources
        cmd: >-
          cd {{.SERVER_DIR}} &&
          { test -s '{{trimSuffix ".yaml" (osBase .ITEM)}}.go' ||
          printf 'package server\n' > '{{trimSuffix ".yaml" (osBase .ITEM)}}.go' ; }
      # impl дописывает только отсутствующие методы, готовый код не трогает.
      - for: sources
        cmd: >-
          cd {{.SERVER_DIR}} && {{.IMPL}} 's *Server'
          {{.MODULE}}/{{trimSuffix ".yaml" (osBase .ITEM)}}.StrictServerInterface
          >> {{trimSuffix ".yaml" (osBase .ITEM)}}.go
      # impl пишет panic; нереализованной ручке лучше отвечать 501 с кодом
      # not_implemented — фронт отличит «ещё не сделано» от поломки.
      - >-
        cd {{.SERVER_DIR}} && sed -i
        's|panic("not implemented") // TODO: Implement|return nil, httperr.ErrNotImplemented|'
        *.go
      # goimports сам добавит httperr и уберёт импорты, ставшие ненужными
      # после того как ручку реализовали.
      - cd {{.SERVER_DIR}} && {{.GOIMPORTS}} -w .

  gen-ts:
    desc: TypeScript — по домену плюс общий api.d.ts для клиента
    sources: ['api/build/*.yaml']
    method: none
    cmds:
      - for: sources
        cmd: >-
          {{.OPENAPI_TS}} '{{.ITEM}}'
          -o packages/contract-ts/domains/{{trimSuffix ".yaml" (osBase .ITEM)}}.d.ts
      # Клиенту нужен один paths на весь API — берём из собранной спеки.
      - '{{.OPENAPI_TS}} api/bundle.yaml -o packages/contract-ts/api.d.ts'

  spec-docs:
    desc: Собрать документацию API в api/docs.html
    deps: [spec]
    cmds:
      - '{{.REDOCLY}} build-docs api/bundle.yaml -o api/docs.html'
      # Сами не открываем: у Task свой шелл, а `start` — не исполняемый файл,
      # а встроенная команда cmd.exe, и вызов через неё ведёт себя непредсказуемо.
      - cmd: echo "готово, откройте api/docs.html"

  check-generated:
    desc: Проверить, что сгенерированное соответствует спеке
    cmds:
      - task: gen
      # Одна проверка на всё: Go-контракт, заготовки, TypeScript. Если
      # перегенерация что-то изменила — спеку правили, а результат не
      # закоммитили.
      - cmd: |
          git diff --exit-code -- packages {{.SERVER_DIR}} || {
            echo ""
            echo "Сгенерированный код разошёлся со спекой."
            echo "Почините: task gen, затем закоммитьте изменения."
            exit 1
          }
      - cmd: |
          test -z "$(git status --porcelain -- packages {{.SERVER_DIR}})" || {
            echo ""
            echo "Появились несохранённые сгенерированные файлы:"
            git status --short -- packages {{.SERVER_DIR}}
            exit 1
          }

  build:
    desc: Собрать сервисы в bin/
    cmds:
      - go build -o bin/investigations-api ./apps/investigations/cmd/api

  fmt:
    desc: gofmt по всем модулям
    cmds:
      - gofmt -w apps packages

  vet:
    desc: go vet помодульно (из-за go.work)
    cmds:
      - cd apps/investigations && go vet ./...
      - cd packages/contract && go vet ./...

  tidy:
    desc: go mod tidy в каждом модуле
    cmds:
      - cd apps/investigations && go mod tidy
      - cd packages/contract && go mod tidy

  check:
    desc: Всё разом — генерация сходится со спекой, собирается, проходит vet
    cmds:
      - task: check-generated
      - task: build
      - task: vet

  dev:
    desc: Поднять локальный стенд (Postgres + api)
    cmds:
      - docker compose -f docker-compose.dev.yml up -d --build

  dev-down:
    desc: Остановить стенд
    cmds:
      - docker compose -f docker-compose.dev.yml down

  dev-logs:
    desc: Логи стенда
    cmds:
      - docker compose -f docker-compose.dev.yml logs -f api

  migrate:
    desc: Применить миграции к локальной базе
    cmds:
      - docker compose -f docker-compose.dev.yml up migrate --exit-code-from migrate
