services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: investigations
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d investigations"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    profiles:
      - container-db

  migrate:
    image: postgres:18
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bash", "/migrate.sh"]
    volumes:
      - ./db/migrations/investigations:/migrations:ro
      - ./db/migrations/seed:/migrations-seed:ro
      - ./deploy/dev/migrate.sh:/migrate.sh:ro
    restart: "no"
    profiles:
      - migrate

  # Applications

  ir-api:
    build:
      context: .
      dockerfile: apps/investigations/Dockerfile
      args:
        BINARY: ir-api
    restart: unless-stopped
    env_file:
      - ./apps/investigations/.env
    ports:
      - "8090:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # SB0RKA_AUTH_BASE_URL=http://localhost:8020: reach host-published Auth from the container
      # without remapping 127.0.0.1 (healthchecks stay on loopback).
      - "localhost:host-gateway"
    profiles:
      - apps

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    restart: unless-stopped
    env_file:
      - ./apps/gateway/.env
    ports:
      - "127.0.0.1:8091:8091"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "localhost:host-gateway"
      # Lab DNS may not publish these hosts. Compose interpolates the project
      # .env only; these two addresses are not process settings.
      - "pt-nad.edtechlab.local:${PT_NAD_HOST_IP:-127.0.0.1}"
      - "mp-siem.edtechlab.local:${PT_SIEM_HOST_IP:-127.0.0.1}"
    profiles:
      - apps

volumes:
  pgdata:

networks:
  default:
    ipam:
      config:
        - subnet: 172.25.0.0/16
