openapi: 3.0.3
info:
  title: Sb0rka external tools gateway
  version: 0.0.1
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  description: Normalized access to external security tools.
servers:
  - url: .
tags:
  - name: health
    description: Gateway process health and readiness.
    x-displayName: health
  - name: sources
    description: Registered external security products.
    x-displayName: sources
  - name: events
    description: Normalized event search.
    x-displayName: events
  - name: findings
    description: Source-native incidents, correlation firings and network attacks.
    x-displayName: findings
  - name: sessions
    description: Source-native network sessions.
    x-displayName: sessions
  - name: entities
    description: Entity lookup across security products.
    x-displayName: entities
  - name: artifacts
    description: Artifact analysis operations.
    x-displayName: artifacts
  - name: endpoints
    description: Endpoint search and response capabilities.
    x-displayName: endpoints
paths:
  /api/v1/sources/{source}/account/userinfo:
    get:
      tags:
        - sources
      summary: Get source account userinfo
      description: >
        Reloads the selected project's current source credentials and returns
        the normalized account identity reported by the source.
      operationId: getSourceAccountUserinfo
      parameters:
        - name: source
          in: path
          required: true
          description: Registered source code.
          schema:
            type: string
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Normalized source account identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountUserinfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/artifact-analyses:
    post:
      tags:
        - artifacts
      summary: Analyze an artifact
      operationId: createArtifactAnalysis
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateArtifactAnalysisRequest'
      responses:
        '202':
          description: Accepted artifact analysis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/artifact-analyses/{analysis_id}:
    get:
      tags:
        - artifacts
      summary: Get an artifact analysis
      operationId: getArtifactAnalysis
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: analysis_id
          in: path
          required: true
          description: Gateway identifier of the artifact analysis.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Artifact analysis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/endpoints/search:
    post:
      tags:
        - endpoints
      summary: Search endpoints
      operationId: searchEndpoints
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchEndpointsRequest'
      responses:
        '200':
          description: EDR endpoints.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchEndpointsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/sources/{source}/endpoints/{external_id}/response-actions:
    get:
      tags:
        - endpoints
      summary: List endpoint response actions
      operationId: listResponseActions
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: source
          in: path
          required: true
          description: Source code of the endpoint-security product.
          schema:
            type: string
        - name: external_id
          in: path
          required: true
          description: Endpoint identifier in the selected source system.
          schema:
            type: string
      responses:
        '200':
          description: Read-only response action catalogue.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    description: Response operations currently advertised for the endpoint.
                    items:
                      $ref: '#/components/schemas/ResponseAction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/entities/lookup:
    post:
      tags:
        - entities
      summary: Look up an entity
      operationId: lookupEntity
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupEntityRequest'
      responses:
        '200':
          description: Context gathered for an entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupEntityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/events/search:
    post:
      tags:
        - events
      summary: Search normalized events
      operationId: searchEvents
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchEventsRequest'
      responses:
        '200':
          description: Normalized events and their context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchEventsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/context/resolve:
    post:
      tags:
        - events
        - entities
      summary: Resolve selected source records
      operationId: resolveContext
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveContextRequest'
      responses:
        '200':
          description: Current normalized data for every selected source record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveContextResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/findings/search:
    post:
      tags:
        - findings
      summary: Search source-native security findings
      operationId: searchFindings
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchFindingsRequest'
      responses:
        '200':
          description: Merged findings from the selected project sources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchFindingsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/sources/{source}/findings/{kind}/{external_id}:
    get:
      tags:
        - findings
      summary: Resolve one source-native finding
      operationId: getFinding
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: source
          in: path
          required: true
          schema:
            type: string
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum:
              - siem_incident
              - siem_correlation
              - nad_attack
        - name: external_id
          in: path
          required: true
          schema:
            type: string
        - name: source_instance
          in: query
          schema:
            type: string
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Finding and the context currently available from its source.
          content:
            application/json:
              schema:
                type: object
                required:
                  - finding
                  - resolution
                properties:
                  finding:
                    $ref: '#/components/schemas/Finding'
                  resolution:
                    $ref: '#/components/schemas/ObjectResolution'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - bearerAuth: []
  /healthz:
    get:
      tags:
        - health
      summary: Check process health
      operationId: healthz
      security: []
      responses:
        '200':
          $ref: '#/components/responses/HealthResponse'
  /ping:
    get:
      tags:
        - health
      summary: Ping
      operationId: ping
      security: []
      responses:
        '200':
          description: pong
          content:
            text/plain:
              schema:
                type: string
                example: pong
              example: pong
  /api/v1/sessions/search:
    post:
      tags:
        - sessions
      summary: Search source-native network sessions
      operationId: searchSessions
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchSessionsRequest'
      responses:
        '200':
          description: Network sessions from the selected project sources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchSessionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/sources/{source}/sessions/{external_id}:
    get:
      tags:
        - sessions
      summary: Resolve one source-native network session
      operationId: getSession
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: source
          in: path
          required: true
          schema:
            type: string
        - name: external_id
          in: path
          required: true
          schema:
            type: string
        - name: source_instance
          in: query
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Session and its current resolution state.
          content:
            application/json:
              schema:
                type: object
                required:
                  - session
                  - resolution
                properties:
                  session:
                    $ref: '#/components/schemas/Session'
                  resolution:
                    $ref: '#/components/schemas/ObjectResolution'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/sources:
    get:
      tags:
        - sources
      summary: List registered sources
      description: >-
        Returns project-allowed sources and probes every configured backend or
        store through a short cache.
      operationId: listSources
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: refresh
          in: query
          required: false
          description: >-
            Bypass cached statuses and reload current project credentials before
            probing.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Registered sources.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    description: >-
                      External security products registered for use through the
                      Gateway.
                    items:
                      $ref: '#/components/schemas/Source'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Sb0rka access token passed as `Bearer <token>`.
  schemas:
    AccountUserinfo:
      type: object
      description: Canonical identity returned by a source account endpoint.
      required:
        - source_code
        - user_name
      properties:
        source_code:
          type: string
          description: Source that supplied the identity.
        user_name:
          type: string
          description: Login name reported by the source.
    ErrorEnvelope:
      type: object
      description: Error returned when a request cannot be completed.
      required:
        - error
      properties:
        error:
          type: object
          description: Structured error details.
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
            message:
              type: string
              description: Safe human-readable error summary.
    Hashes:
      type: object
      description: Cryptographic checksums available for an artifact.
      properties:
        md5:
          type: string
          description: MD5 checksum in hexadecimal form.
        sha1:
          type: string
          description: SHA-1 checksum in hexadecimal form.
        sha256:
          type: string
          description: SHA-256 checksum in hexadecimal form.
    Artifact:
      type: object
      description: File or payload submitted to or produced by an analysis.
      required:
        - id
        - name
        - hashes
      properties:
        id:
          type: string
          format: uuid
          description: Deterministic Gateway identifier of the artifact.
        name:
          type: string
          description: File name reported by the source or caller.
        mime:
          type: string
          description: Reported or detected MIME type.
        size:
          type: integer
          format: int64
          minimum: 0
          description: Artifact size in bytes.
        hashes:
          description: Checksums known for the artifact.
          allOf:
            - $ref: '#/components/schemas/Hashes'
    Analysis:
      type: object
      description: Normalized result of an artifact analysis.
      required:
        - id
        - status
        - artifact
        - verdict
        - artifacts
        - provenance
      properties:
        id:
          type: string
          format: uuid
          description: Gateway identifier of the analysis.
        status:
          type: string
          description: Current processing state of the analysis.
          enum:
            - completed
        artifact:
          description: Primary artifact that was analyzed.
          allOf:
            - $ref: '#/components/schemas/Artifact'
        verdict:
          description: Final normalized assessment of the primary artifact.
          allOf:
            - $ref: '#/components/schemas/Verdict'
        artifacts:
          type: array
          description: Additional artifacts extracted or discovered during analysis.
          items:
            $ref: '#/components/schemas/Artifact'
        attributes:
          type: object
          description: Selected engine and behavior details from the analysis provider.
          additionalProperties: true
        provenance:
          description: Source task from which this result was normalized.
          allOf:
            - $ref: '#/components/schemas/Provenance'
    CreateArtifactAnalysisRequest:
      type: object
      description: Request to analyze a known artifact with one source.
      required:
        - source
        - artifact
      properties:
        source:
          type: string
          description: Source code of the artifact-analysis provider.
        artifact:
          type: object
          description: Metadata used to identify the artifact for analysis.
          required:
            - name
          properties:
            name:
              type: string
              description: File name of the artifact.
            mime:
              type: string
              description: MIME type when known by the caller.
            hashes:
              description: Checksums known by the caller.
              allOf:
                - $ref: '#/components/schemas/Hashes'
    Verdict:
      type: object
      description: Normalized security assessment returned by a source.
      required:
        - value
        - confidence
        - labels
        - provider
      properties:
        value:
          type: string
          description: Normalized assessment of the object.
          enum:
            - malicious
            - suspicious
            - clean
            - unknown
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Provider confidence from 0 to 1.
        labels:
          type: array
          description: Provider classifications preserved as short labels.
          items:
            type: string
        provider:
          type: string
          description: Source code of the provider that produced the verdict.
    Provenance:
      type: object
      description: Origin of a normalized record.
      required:
        - source
        - external_id
        - fetched_at
      properties:
        source:
          type: string
          description: Source code that supplied the record.
        external_id:
          type: string
          description: Identifier of the record in the source system.
        source_url:
          type: string
          format: uri
          description: Optional link to the record in the source system.
        fetched_at:
          type: string
          format: date-time
          description: Time when the Gateway obtained the source data.
    Endpoint:
      type: object
      description: Endpoint asset reported by an endpoint-security source.
      required:
        - id
        - external_id
        - hostname
        - status
        - attributes
        - provenance
      properties:
        id:
          type: string
          format: uuid
          description: >-
            Deterministic identifier derived from the source and external
            endpoint ID.
        external_id:
          type: string
          description: Endpoint or agent identifier in the source system.
        hostname:
          type: string
          description: Host name reported for the endpoint.
        ip_addresses:
          type: array
          description: IP addresses currently associated with the endpoint.
          items:
            type: string
        status:
          type: string
          description: Normalized endpoint connectivity state.
          enum:
            - online
            - offline
            - unknown
        attributes:
          type: object
          description: Selected inventory and agent fields from the source.
          additionalProperties: true
        provenance:
          description: Source record from which the endpoint was normalized.
          allOf:
            - $ref: '#/components/schemas/Provenance'
    ResponseAction:
      type: object
      description: >-
        Response operation advertised for an endpoint; the Gateway does not
        execute it.
      required:
        - code
        - title
        - destructive
        - enabled
      properties:
        code:
          type: string
          description: Stable source action code.
        title:
          type: string
          description: Human-readable action name.
        destructive:
          type: boolean
          description: Whether executing the action may disrupt or alter the endpoint.
        enabled:
          type: boolean
          description: Whether the source currently allows the action for the endpoint.
    SearchEndpointsRequest:
      type: object
      description: Bounded endpoint inventory page request.
      properties:
        sources:
          type: array
          uniqueItems: true
          description: Source codes to query; omit to use every allowed endpoint source.
          items:
            type: string
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
          description: Maximum number of endpoints returned after merging all sources.
        cursor:
          type: string
          description: Opaque next_cursor from the previous response with the same filters.
    SearchEndpointsResponse:
      type: object
      description: Merged endpoint inventory page.
      required:
        - items
        - source_errors
      properties:
        items:
          type: array
          description: Normalized endpoints in the current page.
          items:
            $ref: '#/components/schemas/Endpoint'
        next_cursor:
          type: string
          description: >-
            Opaque cursor for the next page; absent when the search is
            exhausted.
        source_errors:
          type: array
          description: Per-source failures when at least one selected source succeeded.
          items:
            $ref: '#/components/schemas/SourceError'
    SourceError:
      type: object
      description: Failure reported by one source during a multi-source request.
      required:
        - source
        - code
        - message
        - retryable
      properties:
        source:
          type: string
          description: Source code that failed.
        code:
          type: string
          description: Stable machine-readable failure code.
        message:
          type: string
          description: Safe human-readable failure summary.
        retryable:
          type: boolean
          description: >-
            Whether repeating the source request may succeed without changing
            it.
    LookupEntityRequest:
      type: object
      description: Request to enrich one entity from one or more sources.
      required:
        - entity
        - time_range
      properties:
        sources:
          type: array
          uniqueItems: true
          description: >-
            Source codes to query; omit to use every allowed source with entity
            lookup.
          items:
            type: string
        entity:
          description: Entity to normalize and enrich.
          allOf:
            - $ref: '#/components/schemas/EntityRef'
        time_range:
          $ref: '#/components/schemas/TimeRange'
    LookupEntityResponse:
      type: object
      description: Entity enrichment merged from the selected sources.
      required:
        - entities
        - relations
        - verdicts
        - source_errors
      properties:
        entities:
          type: array
          description: Matched entity and related canonical entities.
          items:
            $ref: '#/components/schemas/Entity'
        relations:
          type: array
          description: Relationships between entities in this response.
          items:
            $ref: '#/components/schemas/Relation'
        verdicts:
          type: array
          description: Security assessments returned for the requested entity.
          items:
            $ref: '#/components/schemas/Verdict'
        source_errors:
          type: array
          description: Per-source failures when at least one selected source succeeded.
          items:
            $ref: '#/components/schemas/SourceError'
    EntityRef:
      type: object
      description: Entity value used as a search or lookup condition.
      required:
        - type
        - value
      properties:
        type:
          type: string
          description: Canonical entity kind, such as ip, domain, hostname, email, or hash.
        value:
          type: string
          description: Entity value to normalize and look up.
    TimeRange:
      type: object
      description: Inclusive source-record occurrence-time interval.
      required:
        - from
        - to
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    EntitySource:
      type: object
      description: Source record in which a canonical entity was observed.
      required:
        - source_code
        - source_entity_id
        - fetched_at
      properties:
        source_code:
          type: string
        source_entity_id:
          type: string
        source_ref:
          type: string
          format: uri
        fetched_at:
          type: string
          format: date-time
    Entity:
      type: object
      description: Canonical representation of an observable or asset.
      required:
        - type
        - value
        - attributes
        - sources
      properties:
        type:
          type: string
          description: Canonical entity kind.
        value:
          type: string
          description: Normalized entity value used for deduplication.
        attributes:
          type: object
          description: Selected source-specific fields; never the complete vendor response.
          additionalProperties: true
        sources:
          type: array
          description: Source records in which this entity was observed.
          items:
            $ref: '#/components/schemas/EntitySource'
    Relation:
      type: object
      description: Normalized relationship between two canonical entities.
      required:
        - type
        - source_entity
        - target_entity
        - source_code
        - source_relation_id
        - fetched_at
      properties:
        type:
          type: string
          description: Normalized relationship type, such as connected_to or resolves_to.
        source_entity:
          description: Canonical entity from which the relationship starts.
          allOf:
            - $ref: '#/components/schemas/EntityRef'
        target_entity:
          description: Canonical entity at which the relationship ends.
          allOf:
            - $ref: '#/components/schemas/EntityRef'
        occurred_at:
          type: string
          format: date-time
          description: Optional time when the relationship was observed.
        source_code:
          type: string
          description: Code of the source that supplied the relationship.
        source_relation_id:
          type: string
          description: Original relationship identifier assigned by that source.
        source_ref:
          type: string
          format: uri
        fetched_at:
          type: string
          format: date-time
    Event:
      type: object
      description: Security event normalized from one source record.
      required:
        - source_code
        - source_event_id
        - type
        - title
        - severity
        - occurred_at
        - entities
        - attributes
        - fetched_at
      properties:
        source_code:
          type: string
          description: Code of the source that owns the event.
        source_event_id:
          type: string
          description: Original event identifier assigned by that source.
        source_ref:
          type: string
          format: uri
          description: Optional link to the event in its source system.
        type:
          type: string
          description: Normalized event class.
        title:
          type: string
          description: Short human-readable event summary.
        severity:
          type: string
          description: Severity mapped to the Gateway scale.
          enum:
            - info
            - low
            - medium
            - high
            - critical
            - unknown
        occurred_at:
          type: string
          format: date-time
          description: Time when the event occurred in the source system.
        entities:
          type: array
          description: Canonical entities and their observed roles in this event.
          items:
            $ref: '#/components/schemas/EntityMention'
        attributes:
          type: object
          description: Selected event fields that have no canonical top-level property.
          additionalProperties: true
        fetched_at:
          type: string
          format: date-time
          description: Time when the Gateway obtained the source data.
    ResolveContextRequest:
      type: object
      description: Source records selected by a client for persistence in an investigation.
      properties:
        findings:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SourceObjectRef'
        sessions:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SourceObjectRef'
        events:
          type: array
          maxItems: 500
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EventSourceRef'
        entities:
          type: array
          maxItems: 2000
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EntitySourceRef'
    ResolveContextResponse:
      type: object
      description: >-
        Normalized records and relationships resolved from source-owned
        identifiers.
      required:
        - findings
        - sessions
        - events
        - entities
        - relations
        - resolutions
        - source_errors
      properties:
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        entities:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        relations:
          type: array
          items:
            $ref: '#/components/schemas/Relation'
        resolutions:
          type: array
          description: >-
            Per-selected-object completeness. Missing root records are not
            represented as resolved objects.
          items:
            $ref: '#/components/schemas/ObjectResolution'
        source_errors:
          type: array
          items:
            $ref: '#/components/schemas/SourceError'
    SearchEventsRequest:
      type: object
      description: Filters for a normalized multi-source event search.
      required:
        - time_range
      properties:
        sources:
          type: array
          uniqueItems: true
          description: >-
            Source codes to query; omit to use every allowed source with event
            search.
          items:
            type: string
        time_range:
          description: Required occurrence-time interval.
          allOf:
            - $ref: '#/components/schemas/TimeRange'
        entities:
          type: array
          maxItems: 100
          description: >-
            Entity conditions; an event matches when it contains at least one
            listed entity.
          items:
            $ref: '#/components/schemas/EntityRef'
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
          description: Maximum number of events returned after merging all sources.
        cursor:
          type: string
          description: Opaque next_cursor from the previous response with the same filters.
    SearchEventsResponse:
      type: object
      description: >-
        Merged event page with the entities and relations needed to interpret
        it.
      required:
        - events
        - entities
        - relations
        - source_states
        - source_errors
      properties:
        events:
          type: array
          description: Normalized events in the current page.
          items:
            $ref: '#/components/schemas/Event'
        entities:
          type: array
          description: Canonical entities referenced by the returned events.
          items:
            $ref: '#/components/schemas/Entity'
        relations:
          type: array
          description: Relationships whose endpoints are present in the returned entities.
          items:
            $ref: '#/components/schemas/Relation'
        next_cursor:
          type: string
          description: >-
            Opaque cursor for the next page; absent when the search is
            exhausted.
        source_states:
          type: array
          items:
            $ref: '#/components/schemas/SourceState'
        source_errors:
          type: array
          description: Per-source failures when at least one selected source succeeded.
          items:
            $ref: '#/components/schemas/SourceError'
    ObjectResolution:
      type: object
      required:
        - ref
        - status
        - errors
      properties:
        ref:
          $ref: '#/components/schemas/SourceObjectRef'
        status:
          type: string
          enum:
            - complete
            - partial
        errors:
          type: array
          items:
            $ref: '#/components/schemas/SourceError'
    EntityMention:
      type: object
      description: >-
        Canonical entity mentioned by an event or a source object, with its
        observed roles.
      required:
        - type
        - value
        - roles
      properties:
        type:
          type: string
          description: Canonical entity kind.
        value:
          type: string
          description: Canonical entity value.
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          description: >-
            Roles observed in this record; vendor direction and attacker
            semantics remain distinct.
          items:
            type: string
            enum:
              - mentions
              - src
              - dst
              - actor
              - object
              - attacker
              - victim
              - account
              - file
    SourceState:
      type: object
      description: Completeness of one source stream in a search response.
      required:
        - source
        - status
      properties:
        source:
          type: string
        status:
          type: string
          enum:
            - complete
            - truncated
            - failed
        reason:
          type: string
    SourceObjectRef:
      type: object
      description: >-
        Stable source-owned object identity plus the bounded time window needed
        to resolve it again.
      required:
        - source_code
        - record_type
        - external_id
        - time_range
      properties:
        source_code:
          type: string
        source_instance:
          type: string
          description: >-
            Provider instance, such as a PT NAD numeric store id. Empty for
            SIEM.
        record_type:
          type: string
          enum:
            - siem_incident
            - siem_correlation
            - nad_attack
            - nad_session
        external_id:
          type: string
          description: >-
            Identifier assigned by the source. The time window is not part of
            identity.
        time_range:
          $ref: '#/components/schemas/TimeRange'
    EventSourceRef:
      type: object
      description: Stable reference to an event in its source system.
      required:
        - source_code
        - source_event_id
      properties:
        source_code:
          type: string
          description: Code of the source that owns the event.
        source_event_id:
          type: string
          description: Original event identifier assigned by that source.
    EntitySourceRef:
      type: object
      description: Stable reference to an entity record in its source system.
      required:
        - source_code
        - source_entity_id
      properties:
        source_code:
          type: string
          description: Code of the source that owns the entity record.
        source_entity_id:
          type: string
          description: Original entity identifier assigned by that source.
    FindingKind:
      type: string
      enum:
        - siem_incident
        - siem_correlation
        - nad_attack
    RuleRef:
      type: object
      description: Bounded rule metadata observed on a finding.
      required:
        - name
      properties:
        id:
          type: string
        name:
          type: string
        revision:
          type: integer
    IncidentDetails:
      type: object
      properties:
        key:
          type: string
        external_key:
          type: string
        verdict:
          type: string
        damage:
          type: string
        recommendation:
          type: string
        assigned_to:
          type: string
        changed_at:
          type: string
          format: date-time
        archived:
          type: boolean
        removed:
          type: boolean
    CorrelationDetails:
      type: object
      properties:
        correlation_type:
          type: string
        subevent_count:
          type: integer
          minimum: 0
    NADAttackDetails:
      type: object
      properties:
        class:
          type: string
        gid:
          type: integer
        sid:
          type: integer
        revision:
          type: integer
        raw_priority:
          type: integer
        false_positive:
          type: boolean
          nullable: true
    Finding:
      type: object
      description: A source-native coarse security object; never a renamed raw event.
      required:
        - ref
        - kind
        - title
        - severity
        - occurred_at
        - entities
        - fetched_at
      properties:
        ref:
          $ref: '#/components/schemas/SourceObjectRef'
        kind:
          $ref: '#/components/schemas/FindingKind'
        title:
          type: string
        description:
          type: string
        severity:
          type: string
          enum:
            - info
            - low
            - medium
            - high
            - critical
            - unknown
        occurred_at:
          type: string
          format: date-time
        status:
          type: string
        rule:
          $ref: '#/components/schemas/RuleRef'
        entities:
          type: array
          items:
            $ref: '#/components/schemas/EntityMention'
        related_findings:
          type: array
          items:
            $ref: '#/components/schemas/SourceObjectRef'
        related_sessions:
          type: array
          items:
            $ref: '#/components/schemas/SourceObjectRef'
        incident:
          $ref: '#/components/schemas/IncidentDetails'
        correlation:
          $ref: '#/components/schemas/CorrelationDetails'
        nad_attack:
          $ref: '#/components/schemas/NADAttackDetails'
        source_ref:
          type: string
          format: uri
        fetched_at:
          type: string
          format: date-time
    NetworkEndpoint:
      type: object
      required:
        - port
      properties:
        ip:
          type: string
        mac:
          type: string
        host:
          type: string
        port:
          type: integer
          minimum: 0
          maximum: 65535
    TrafficCounters:
      type: object
      properties:
        sent:
          type: integer
          format: int64
          minimum: 0
        received:
          type: integer
          format: int64
          minimum: 0
        total:
          type: integer
          format: int64
          minimum: 0
    SessionFileHint:
      type: object
      description: >-
        Safe metadata for a file observed in the session; file content and full
        vendor records are never returned.
      required:
        - external_id
        - size
      properties:
        external_id:
          type: string
        name:
          type: string
        mime:
          type: string
        size:
          type: integer
          format: int64
          minimum: 0
        md5:
          type: string
        sha256:
          type: string
        state:
          type: string
        direction:
          type: string
    SessionAuthenticationHint:
      type: object
      description: >-
        Non-secret authentication metadata; proofs, session keys, passwords, and
        protocol payloads are excluded.
      required:
        - protocol
      properties:
        protocol:
          type: string
        method:
          type: string
        account:
          type: string
        valid:
          type: boolean
          nullable: true
        failed_attempts:
          type: integer
          format: int64
          minimum: 0
        client_host:
          type: string
        server_host:
          type: string
    Session:
      type: object
      required:
        - ref
        - title
        - severity
        - started_at
        - source_endpoint
        - destination_endpoint
        - transport_protocol
        - state
        - file_hints
        - authentication_hints
        - entities
        - related_findings
        - fetched_at
      properties:
        ref:
          $ref: '#/components/schemas/SourceObjectRef'
        title:
          type: string
        severity:
          type: string
          enum:
            - info
            - low
            - medium
            - high
            - critical
            - unknown
        raw_criticality:
          type: integer
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        duration_seconds:
          type: number
          format: double
          minimum: 0
        source_endpoint:
          $ref: '#/components/schemas/NetworkEndpoint'
        destination_endpoint:
          $ref: '#/components/schemas/NetworkEndpoint'
        transport_protocol:
          type: string
        application_protocol:
          type: string
        bytes:
          $ref: '#/components/schemas/TrafficCounters'
        packets:
          $ref: '#/components/schemas/TrafficCounters'
        state:
          type: array
          items:
            type: string
        false_positive:
          type: boolean
          nullable: true
        has_files:
          type: boolean
        file_hints:
          type: array
          items:
            $ref: '#/components/schemas/SessionFileHint'
        authentication_hints:
          type: array
          items:
            $ref: '#/components/schemas/SessionAuthenticationHint'
        tcp_flags:
          type: array
          items:
            type: string
        entities:
          type: array
          items:
            $ref: '#/components/schemas/EntityMention'
        related_findings:
          type: array
          items:
            $ref: '#/components/schemas/SourceObjectRef'
        source_ref:
          type: string
          format: uri
        fetched_at:
          type: string
          format: date-time
    SearchFindingsRequest:
      type: object
      required:
        - time_range
      properties:
        sources:
          type: array
          uniqueItems: true
          items:
            type: string
        kinds:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/FindingKind'
        time_range:
          $ref: '#/components/schemas/TimeRange'
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
        cursor:
          type: string
    SearchFindingsResponse:
      type: object
      required:
        - findings
        - source_states
        - source_errors
      properties:
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
        next_cursor:
          type: string
        source_states:
          type: array
          items:
            $ref: '#/components/schemas/SourceState'
        source_errors:
          type: array
          items:
            $ref: '#/components/schemas/SourceError'
    Health:
      type: object
      description: Service health response.
      required:
        - status
      properties:
        status:
          type: string
          description: Current health state of the checked component.
          enum:
            - ok
    SearchSessionsRequest:
      type: object
      required:
        - time_range
      properties:
        sources:
          type: array
          uniqueItems: true
          items:
            type: string
        time_range:
          $ref: '#/components/schemas/TimeRange'
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
        cursor:
          type: string
    SearchSessionsResponse:
      type: object
      required:
        - sessions
        - source_states
        - source_errors
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        next_cursor:
          type: string
        source_states:
          type: array
          items:
            $ref: '#/components/schemas/SourceState'
        source_errors:
          type: array
          items:
            $ref: '#/components/schemas/SourceError'
    Capability:
      type: string
      description: Operation that a source can perform through the Gateway.
      enum:
        - findings
        - sessions
        - events
        - entity_lookup
        - artifact_analysis
        - endpoints
        - response_catalog
        - account_userinfo
    Source:
      type: object
      description: External security product registered in the Gateway.
      required:
        - code
        - name
        - kind
        - mode
        - status
        - capabilities
      properties:
        code:
          type: string
          description: Stable source identifier used in requests and provenance.
        name:
          type: string
          description: Human-readable product name.
        kind:
          type: string
          description: Functional class of the security product.
          enum:
            - siem
            - ndr
            - edr
            - sandbox
            - threat_intelligence
        mode:
          type: string
          description: Adapter mode currently backing the source.
          enum:
            - proxy
        status:
          type: string
          description: Result of the current connection probe.
          enum:
            - online
            - degraded
            - offline
        capabilities:
          type: array
          description: Operations implemented by this source.
          items:
            $ref: '#/components/schemas/Capability'
  parameters:
    ProjectId:
      name: X-Project-ID
      in: header
      required: true
      description: Sb0rka project whose integration allowlist is used.
      schema:
        type: string
        pattern: ^[a-f0-9]{10,12}$
  responses:
    ErrorResponse:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: A valid bearer access token is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: The project is not configured or the source is not allowed there.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: The selected source or requested record does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: An unexpected internal failure occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BadGateway:
      description: Every selected external source failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: The selected source has no usable project-scoped configuration.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    GatewayTimeout:
      description: The Gateway or selected source exceeded its deadline.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BadRequest:
      description: The request is malformed or violates an input constraint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: The selected source cannot perform the requested operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    HealthResponse:
      description: Service health.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Health'
