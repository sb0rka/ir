openapi: 3.0.3
info:
  title: Sb0rka external tools gateway
  version: 0.0.1
  description: Normalized access to external security tools.
servers:
  - url: http://localhost:8091
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      summary: Check process health
      operationId: healthz
      security: []
      responses:
        '200':
          $ref: './shared/responses.yaml#/HealthResponse'
  /readyz:
    get:
      summary: Check service readiness
      operationId: readyz
      security: []
      responses:
        '200':
          $ref: './shared/responses.yaml#/HealthResponse'
  /api/v1/sources:
    $ref: './paths/sources.yaml'
  /api/v1/events/search:
    $ref: './paths/events.yaml'
  /api/v1/entities/lookup:
    $ref: './paths/entities.yaml'
  /api/v1/artifact-analyses:
    $ref: './paths/artifacts.yaml#/create'
  /api/v1/artifact-analyses/{analysis_id}:
    $ref: './paths/artifacts.yaml#/get'
  /api/v1/endpoints/search:
    $ref: './paths/endpoints.yaml#/search'
  /api/v1/sources/{source}/endpoints/{external_id}/response-actions:
    $ref: './paths/endpoints.yaml#/responseActions'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
