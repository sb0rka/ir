openapi: 3.0.3
info:
  title: Sb0rka Investigations API
  version: 0.0.1
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  description: REST API for SOC investigations and their evidence graphs.
servers:
  - url: /api/v1
security:
  - bearerAuth: []

tags:
  - name: authentication
    description: OIDC sessions and explicit integration consent.
  - name: groups
    description: Entity and event groups isolated to one root investigation and its descendants.
  - name: investigations
    description: Root and child cases, each with an independent lifecycle and graph.
  - name: hypotheses
    description: Named graph projections without child hypotheses.
  - name: events
    description: Project events and their investigation links.
  - name: findings
    description: Project-scoped source findings attached to investigations.
  - name: sessions
    description: Project-scoped network sessions attached to investigations.
  - name: entities
    description: Project entities extracted from events or added by analysts.
  - name: graph
    description: Investigation graph nodes, edges and evidence.
  - name: reference
    description: Entity types, relations and configured sources.
  - name: som
    description: SOM kanban facade — issues as runnable agent tasks.

components:
  securitySchemes:
    irRefresh:
      type: apiKey
      in: cookie
      name: __Host-ir_refresh
      description: Host-only opaque IR refresh handle (ir_refresh in HTTP development); Origin must match the configured web origin.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Auth-issued Ed25519 at+jwt access token for the sb0rka-ir audience.
        IR validates the local login session, consent and current project RBAC.
        X-Project-ID selects an authorized project; it does not grant access.
