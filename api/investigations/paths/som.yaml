openapi: 3.0.3
info:
  title: IR — SOM integration
  version: 0.0.1
servers:
  - url: /api/v1
security:
  - bearerAuth: []

# Thin facade over SOM API

paths:
  /som/workspaces:
    parameters:
      - $ref: '../shared/parameters.yaml#/components/parameters/ProjectId'
    get:
      tags: [som]
      summary: SOM workspaces of the configured project account
      description: >-
        Reloads `DEMO_SOM_ACCESS_TOKEN` from the selected project's Secrets,
        activates it in the in-memory cache, and proxies SOM
        `GET /v1/workspaces`.
      operationId: listSomWorkspaces
      responses:
        '200':
          description: Workspaces visible to the caller
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SomWorkspace' }
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '500': { $ref: '../shared/responses.yaml#/components/responses/InternalError' }
        '502': { $ref: '../shared/responses.yaml#/components/responses/SourceUnavailable' }

  /som/workspaces/{workspace_id}/boards:
    parameters:
      - $ref: '../shared/parameters.yaml#/components/parameters/ProjectId'
      - name: workspace_id
        in: path
        required: true
        description: SOM workspace whose boards are listed.
        schema: { type: string, format: uuid }
    get:
      tags: [som]
      summary: Boards of a SOM workspace
      description: >-
        Proxies SOM `GET /v1/boards?workspace_id=...` with the selected
        project's cached `DEMO_SOM_ACCESS_TOKEN`.
      operationId: listSomBoards
      responses:
        '200':
          description: Boards of the workspace
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SomBoard' }
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '500': { $ref: '../shared/responses.yaml#/components/responses/InternalError' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
        '502': { $ref: '../shared/responses.yaml#/components/responses/SourceUnavailable' }

  /som/boards/{board_id}/issues:
    parameters:
      - $ref: '../shared/parameters.yaml#/components/parameters/ProjectId'
      - name: board_id
        in: path
        required: true
        description: SOM board whose issues are listed.
        schema: { type: string, format: uuid }
    get:
      tags: [som]
      summary: Issues of a SOM board
      description: >-
        Proxies SOM `GET /v1/issues?board_id=...`. Issues and sub-issues are
        runnable investigation tasks or verification steps, not hypotheses.
      operationId: listSomIssues
      responses:
        '200':
          description: Issues of the board
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SomIssueList' }
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '500': { $ref: '../shared/responses.yaml#/components/responses/InternalError' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
        '502': { $ref: '../shared/responses.yaml#/components/responses/SourceUnavailable' }

  /som/issues/{issue_id}/run:
    parameters:
      - $ref: '../shared/parameters.yaml#/components/parameters/ProjectId'
      - name: issue_id
        in: path
        required: true
        description: SOM issue to run an agent on.
        schema: { type: string, format: uuid }
    post:
      tags: [som]
      summary: Run an agent on a SOM issue
      description: >-
        Orchestrates a run: reads the issue from SOM, opens a relay session to
        the configured daemon host, starts an environment with the issue text
        as the prompt, then links the environment back to the issue in SOM.
        SOM requests use the selected project's cached access-token secret.
        `variant` and `model_id` are forwarded as daemon `executor_config`.
        With hypothesis_id, the hypothesis must be active before any external
        calls; the prompt reads its nested graph and submits explicit results to
        its nested endpoint while retaining the investigation-wide timeline.
        Stateless — nothing is persisted about the run in IR; the ids in the
        response are the only handle on it.
      operationId: runSomIssue
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SomIssueRunRequest' }
      responses:
        '201':
          description: The run was started and linked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SomIssueRunResult' }
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '500': { $ref: '../shared/responses.yaml#/components/responses/InternalError' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
        '409': { $ref: '../shared/responses.yaml#/components/responses/Conflict' }
        '422': { $ref: '../shared/responses.yaml#/components/responses/ValidationError' }
        '502': { $ref: '../shared/responses.yaml#/components/responses/SourceUnavailable' }

  /som/environments/{local_environment_id}:
    parameters:
      - $ref: '../shared/parameters.yaml#/components/parameters/ProjectId'
      - name: local_environment_id
        in: path
        required: true
        description: Daemon environment id returned by runSomIssue.
        schema: { type: string, format: uuid }
      - name: investigation_id
        in: query
        required: false
        description: >-
          When set with som_issue_id, the response includes how many agent
          graph nodes and edges this issue already wrote into the investigation.
        schema: { type: string, format: uuid }
      - name: som_issue_id
        in: query
        required: false
        description: SOM issue UUID whose agent writes should be counted.
        schema: { type: string, format: uuid }
    get:
      tags: [som]
      summary: Status of a SOM agent environment
      description: >-
        Opens a relay session to the configured daemon host and reads
        `POST /api/environments/summaries` (not `GET /api/environments/{id}`,
        which omits run flags). Maps `latest_process_status` into a coarse
        status for the IR UI to poll until the coding-agent process finishes.
        Optional investigation_id + som_issue_id return factual write counts
        so a completed run with zero graph changes is visible.
      operationId: getSomEnvironment
      responses:
        '200':
          description: Current environment status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SomEnvironmentStatus' }
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '500': { $ref: '../shared/responses.yaml#/components/responses/InternalError' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
        '502': { $ref: '../shared/responses.yaml#/components/responses/SourceUnavailable' }

components:
  schemas:
    SomWorkspace:
      type: object
      description: A SOM workspace visible to the configured project account.
      required: [id, name, slug, is_personal, issue_prefix, user_role]
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the workspace in SOM.
        name:
          type: string
          description: Display name.
        slug:
          type: string
          description: URL slug of the workspace.
        is_personal:
          type: boolean
          description: Whether this is the caller's personal workspace.
        issue_prefix:
          type: string
          description: Prefix used in issue simple ids, e.g. "IR".
        user_role:
          type: string
          description: Configured SOM account's workspace role — ADMIN or MEMBER.

    SomBoard:
      type: object
      description: A kanban board inside a SOM workspace.
      required: [id, workspace_id, name]
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the board in SOM.
        workspace_id:
          type: string
          format: uuid
          description: Workspace the board belongs to.
        name:
          type: string
          description: Display name.

    SomIssue:
      type: object
      description: >-
        A SOM issue — a task or verification step that an agent can execute.
      required: [id, board_id, issue_number, simple_id, title]
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the issue in SOM.
        board_id:
          type: string
          format: uuid
          description: Board the issue belongs to.
        issue_number:
          type: integer
          description: Sequential number within the workspace.
        simple_id:
          type: string
          description: Human-readable id, e.g. "IR-42".
        title:
          type: string
          description: What the task is.
        description:
          type: string
          nullable: true
          description: >-
            Full task text. For runnable skills this holds the instructions the
            agent will follow.
        priority:
          type: string
          nullable: true
          description: urgent, high, medium or low. Absent when not set.
        parent_issue_id:
          type: string
          format: uuid
          nullable: true
          description: Parent task for a nested verification step.

    SomIssueList:
      type: object
      description: Issues of one board with the count reported by SOM.
      required: [issues, total_count]
      properties:
        issues:
          type: array
          items: { $ref: '#/components/schemas/SomIssue' }
        total_count:
          type: integer
          description: Total issues on the board, regardless of paging.

    SomIssueRunRequest:
      type: object
      description: Context IR adds to the run.
      required: [investigation_id]
      properties:
        investigation_id:
          type: string
          format: uuid
          description: >-
            Investigation the agent should enrich. Passed to the agent inside
            the prompt so it knows where to attach found events and nodes.
        hypothesis_id:
          type: string
          format: uuid
          description: >-
            Optional active hypothesis to work on. Omit it to keep the existing
            unscoped run against the full investigation graph.
        variant:
          type: string
          description: >-
            Daemon executor variant, e.g. DEFAULT. Omitted uses the executor's
            default variant.
        model_id:
          type: string
          description: >-
            OpenCode model id in `provider/model` form, forwarded as
            executor_config.model_id. Omitted value is
            `openrouter/deepseek/deepseek-v4-flash`.

    SomIssueRunResult:
      type: object
      description: >-
        Handles of the started run. IR stores nothing about it — poll SOM or
        the daemon with these ids.
      required: [issue_id, board_id, local_environment_id, som_environment_id]
      properties:
        issue_id:
          type: string
          format: uuid
          description: The issue the run was started for.
        board_id:
          type: string
          format: uuid
          description: Board of the issue; the SOM environment is linked under it.
        local_environment_id:
          type: string
          format: uuid
          description: Environment created on the daemon host.
        som_environment_id:
          type: string
          format: uuid
          description: SOM environment record linking the run to the issue.
        repo_id:
          type: string
          format: uuid
          description: Daemon repository the environment was started on.

    SomEnvironmentStatus:
      type: object
      description: >-
        Coarse agent-run status derived from the daemon environment summary
        (`latest_process_status`), optionally enriched with factual graph
        writes for the SOM issue.
      required: [local_environment_id, status]
      properties:
        local_environment_id:
          type: string
          format: uuid
          description: Daemon environment id being polled.
        status:
          type: string
          enum: [running, completed, failed]
          description: >-
            `running` while the latest coding-agent/setup/cleanup process is
            `running` or has not appeared yet; `failed` when it is `failed` or
            `killed`; `completed` when it is `completed`.
        is_running:
          type: boolean
          description: True while status is running.
        is_errored:
          type: boolean
          description: True while status is failed.
        agent_results:
          $ref: '#/components/schemas/SomEnvironmentAgentResults'

    SomEnvironmentAgentResults:
      type: object
      description: >-
        Counts of investigation graph facts written by the SOM issue. Present
        only when investigation_id and som_issue_id were supplied on the
        status request.
      required: [nodes, edges]
      properties:
        nodes:
          type: integer
          minimum: 0
          description: Graph nodes tagged with this som_issue_id.
        edges:
          type: integer
          minimum: 0
          description: Proposed agent edges whose origin_ref is this som_issue_id.
