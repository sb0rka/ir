openapi: 3.0.3
info:
  title: IR — investigation tree groups
  version: 0.0.1
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /investigations/{investigation_id}/graph/projection:
    parameters:
      - { $ref: '../shared/parameters.yaml#/components/parameters/ProjectId' }
      - { $ref: '../shared/parameters.yaml#/components/parameters/InvestigationId' }
    get:
      tags: [groups]
      operationId: getGraphProjection
      summary: Read lossless grouped graph in the requested view
      description: Groups belong to the root investigation tree. This view never imports absent evidence or groups from another root. Raw UUID graph CRUD is unchanged.
      parameters:
        - name: include_subtree
          in: query
          description: Include descendants of this case, never ancestors or sibling branches.
          schema: { type: boolean, default: false }
        - name: min_confidence
          in: query
          schema: { type: number, minimum: 0, maximum: 1 }
        - name: statuses
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { type: string, enum: [proposed, confirmed, rejected] }
      responses:
        '200':
          description: Scoped result; missing and foreign-tree groups are indistinguishable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GraphProjection' }
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
        '409': { $ref: '../shared/responses.yaml#/components/responses/Conflict' }
        '422': { $ref: '../shared/responses.yaml#/components/responses/ValidationError' }
        '500': { $ref: '../shared/responses.yaml#/components/responses/InternalError' }
  /investigations/{investigation_id}/hypotheses/{hypothesis_id}/graph/projection:
    parameters:
      - { $ref: '../shared/parameters.yaml#/components/parameters/ProjectId' }
      - { $ref: '../shared/parameters.yaml#/components/parameters/InvestigationId' }
      - { $ref: '../shared/parameters.yaml#/components/parameters/HypothesisId' }
    get:
      tags: [groups]
      operationId: getHypothesisGraphProjection
      summary: Read lossless grouped graph in the requested view
      description: Groups belong to the root investigation tree. This view never imports absent evidence or groups from another root. Raw UUID graph CRUD is unchanged.
      parameters:
        - name: min_confidence
          in: query
          schema: { type: number, minimum: 0, maximum: 1 }
        - name: statuses
          in: query
