        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
        '409': { $ref: '../shared/responses.yaml#/components/responses/Conflict' }
        '422': { $ref: '../shared/responses.yaml#/components/responses/ValidationError' }
        '500': { $ref: '../shared/responses.yaml#/components/responses/InternalError' }
  /investigations/{root_id}/entity-groups/{group_id}:
    parameters:
      - { $ref: '../shared/parameters.yaml#/components/parameters/ProjectId' }
      - name: root_id
        in: path
        required: true
        description: Root investigation UUID; the server verifies it has no parent.
        schema: { type: string, format: uuid }
      - name: group_id
        in: path
        required: true
        description: Group UUID in this project and root investigation tree.
        schema: { type: string, format: uuid }
    get:
      tags: [groups]
      operationId: getEntityGroup
      summary: detail entity group within one investigation tree
      description: Decisions apply to the root and all descendants. No cross-root sharing or implicit merge is allowed. Retries require the same operation ID and payload.
      responses:
