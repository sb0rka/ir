Provenance:
  type: object
  description: Origin of a normalized record.
  required: [source, external_id, fetched_at]
  properties:
    source:
      type: string
      description: Source code that supplied the record.
    external_id:
      type: string
      description: Identifier of the record in the source system.
    source_url:
      type: string
      format: uri
      description: Optional link to the record in the source system.
    fetched_at:
      type: string
      format: date-time
      description: Time when the Gateway obtained the source data.

EntityRef:
  type: object
  description: Entity value used as a search or lookup condition.
  required: [type, value]
  properties:
    type:
      type: string
      description: Canonical entity kind, such as ip, domain, hostname, email, or hash.
    value:
      type: string
      description: Entity value to normalize and look up.

EntityMention:
  type: object
  description: Canonical entity mentioned by an event or a source object, with its observed roles.
  required: [type, value, roles]
  properties:
    type:
      type: string
      description: Canonical entity kind.
    value:
      type: string
      description: Canonical entity value.
    roles:
      type: array
      minItems: 1
      uniqueItems: true
      description: Roles observed in this record; vendor direction and attacker semantics remain distinct.
      items:
        type: string
        enum: [mentions, src, dst, actor, object, attacker, victim, account, file]

TimeRange:
  type: object
  description: Inclusive source-record occurrence-time interval.
  required: [from, to]
  properties:
    from:
      type: string
      format: date-time
    to:
      type: string
      format: date-time

SourceObjectRef:
  type: object
  description: Stable source-owned object identity plus the bounded time window needed to resolve it again.
  required: [source_code, record_type, external_id, time_range]
  properties:
    source_code:
      type: string
    source_instance:
      type: string
      description: Provider instance, such as a PT NAD numeric store id. Empty for SIEM.
    record_type:
      type: string
      enum: [siem_incident, siem_correlation, nad_attack, nad_session]
    external_id:
      type: string
      description: Identifier assigned by the source. The time window is not part of identity.
    time_range:
      $ref: '#/TimeRange'

RuleRef:
  type: object
  description: Bounded rule metadata observed on a finding.
  required: [name]
  properties:
    id:
      type: string
    name:
      type: string
    revision:
      type: integer

SourceState:
  type: object
  description: Completeness of one source stream in a search response.
  required: [source, status]
  properties:
    source:
      type: string
    status:
      type: string
      enum: [complete, truncated, failed]
    reason:
      type: string
    total:
      type: integer
      format: int64
      minimum: 0
      description: >-
        Vendor match count for this source and query when known. Absent when the
        source did not report a total (for example noCount without totalCount).

EventSourceRef:
  type: object
  description: Stable reference to an event in its source system.
  required: [source_code, source_event_id]
  properties:
    source_code:
      type: string
      description: Code of the source that owns the event.
    source_event_id:
      type: string
      description: Original event identifier assigned by that source.

EntitySourceRef:
  type: object
  description: Stable reference to an entity record in its source system.
  required: [source_code, source_entity_id]
  properties:
    source_code:
      type: string
      description: Code of the source that owns the entity record.
    source_entity_id:
      type: string
      description: Original entity identifier assigned by that source.

EntitySource:
  type: object
  description: Source record in which a canonical entity was observed.
  required: [source_code, source_entity_id, fetched_at]
  properties:
    source_code:
      type: string
    source_entity_id:
      type: string
    source_ref:
      type: string
      format: uri
    fetched_at:
      type: string
      format: date-time

Entity:
  type: object
  description: Canonical representation of an observable or asset.
  required: [type, value, attributes, sources]
  properties:
    type:
      type: string
      description: Canonical entity kind.
    value:
      type: string
      description: Normalized entity value used for deduplication.
    attributes:
      type: object
      description: Selected source-specific fields; never the complete vendor response.
      additionalProperties: true
    sources:
      type: array
      description: Source records in which this entity was observed.
      items:
        $ref: '#/EntitySource'

Relation:
  type: object
  description: Normalized relationship between two canonical entities.
  required: [type, source_entity, target_entity, source_code, source_relation_id, fetched_at]
  properties:
    type:
      type: string
      description: Normalized relationship type, such as connected_to or resolves_to.
    source_entity:
      description: Canonical entity from which the relationship starts.
      allOf:
        - $ref: '#/EntityRef'
    target_entity:
      description: Canonical entity at which the relationship ends.
      allOf:
        - $ref: '#/EntityRef'
    occurred_at:
      type: string
      format: date-time
      description: Optional time when the relationship was observed.
    source_code:
      type: string
      description: Code of the source that supplied the relationship.
    source_relation_id:
      type: string
      description: Original relationship identifier assigned by that source.
    source_ref:
      type: string
      format: uri
    fetched_at:
      type: string
      format: date-time

Verdict:
  type: object
  description: Normalized security assessment returned by a source.
  required: [value, confidence, labels, provider]
  properties:
    value:
      type: string
      description: Normalized assessment of the object.
      enum: [malicious, suspicious, clean, unknown]
    confidence:
      type: number
      format: double
      minimum: 0
      maximum: 1
      description: Provider confidence from 0 to 1.
    labels:
      type: array
      description: Provider classifications preserved as short labels.
      items:
        type: string
    provider:
      type: string
      description: Source code of the provider that produced the verdict.

SourceError:
  type: object
  description: Failure reported by one source during a multi-source request.
  required: [source, code, message, retryable]
  properties:
    source:
      type: string
      description: Source code that failed.
    code:
      type: string
      description: Stable machine-readable failure code.
    message:
      type: string
      description: Safe human-readable failure summary.
    retryable:
      type: boolean
      description: Whether repeating the source request may succeed without changing it.

Health:
  type: object
  description: Service health response.
  required: [status]
  properties:
    status:
      type: string
      description: Current health state of the checked component.
      enum: [ok]

ErrorEnvelope:
  type: object
  description: Error returned when a request cannot be completed.
  required: [error]
  properties:
    error:
      type: object
      description: Structured error details.
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
        message:
          type: string
          description: Safe human-readable error summary.
