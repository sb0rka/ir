openapi: 3.0.3
info:
  title: Sb0rka Gateway - entities
  version: 0.0.1
servers:
  - url: http://localhost:8091
security:
  - bearerAuth: []

paths:
  /api/v1/entities/lookup:
    post:
      tags: [entities]
      summary: Look up an entity
      operationId: lookupEntity
      parameters:
        - $ref: '../shared/parameters.yaml#/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupEntityRequest'
      responses:
        '200':
          description: Context gathered for an entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupEntityResponse'
        default:
          $ref: '../shared/responses.yaml#/ErrorResponse'

components:
  schemas:
    LookupEntityRequest:
      type: object
      description: Request to enrich one entity from one or more sources.
      required: [entity]
      properties:
        sources:
          type: array
          uniqueItems: true
          description: Source codes to query; omit to use every allowed source with entity lookup.
          items:
            type: string
        entity:
          description: Entity to normalize and enrich.
          allOf:
            - $ref: '../shared/schemas.yaml#/EntityRef'

    LookupEntityResponse:
      type: object
      description: Entity enrichment merged from the selected sources.
      required: [entities, relations, verdicts, source_errors]
      properties:
        entities:
          type: array
          description: Matched entity and related canonical entities.
          items:
            $ref: '../shared/schemas.yaml#/Entity'
        relations:
          type: array
          description: Relationships between entities in this response.
          items:
            $ref: '../shared/schemas.yaml#/Relation'
        verdicts:
          type: array
          description: Security assessments returned for the requested entity.
          items:
            $ref: '../shared/schemas.yaml#/Verdict'
        source_errors:
          type: array
          description: Per-source failures when at least one selected source succeeded.
          items:
            $ref: '../shared/schemas.yaml#/SourceError'
