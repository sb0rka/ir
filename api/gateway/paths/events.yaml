openapi: 3.0.3
info:
  title: Sb0rka Gateway - events
  version: 0.0.1
servers:
  - url: .
security:
  - bearerAuth: []

paths:
  /api/v1/events/search:
    post:
      tags: [events]
      summary: Search normalized events
      operationId: searchEvents
      parameters:
        - $ref: '../shared/parameters.yaml#/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchEventsRequest'
      responses:
        '200':
          description: Normalized events and their context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchEventsResponse'
        '400': { $ref: '../shared/responses.yaml#/BadRequest' }
        '401': { $ref: '../shared/responses.yaml#/Unauthorized' }
        '403': { $ref: '../shared/responses.yaml#/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/NotFound' }
        '422': { $ref: '../shared/responses.yaml#/ValidationError' }
        '502': { $ref: '../shared/responses.yaml#/BadGateway' }
        '504': { $ref: '../shared/responses.yaml#/GatewayTimeout' }
        '500': { $ref: '../shared/responses.yaml#/InternalError' }
        default:
          $ref: '../shared/responses.yaml#/ErrorResponse'

  /api/v1/events/aggregate:
    post:
      tags: [events]
      summary: Aggregate events into source-local groups
      operationId: aggregateEvents
      parameters:
        - $ref: '../shared/parameters.yaml#/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AggregateEventsRequest'
      responses:
        '200':
          description: Source-local event groups and their counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregateEventsResponse'
        '400': { $ref: '../shared/responses.yaml#/BadRequest' }
        '401': { $ref: '../shared/responses.yaml#/Unauthorized' }
        '403': { $ref: '../shared/responses.yaml#/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/NotFound' }
        '422': { $ref: '../shared/responses.yaml#/ValidationError' }
        '502': { $ref: '../shared/responses.yaml#/BadGateway' }
        '504': { $ref: '../shared/responses.yaml#/GatewayTimeout' }
        '500': { $ref: '../shared/responses.yaml#/InternalError' }
        default:
          $ref: '../shared/responses.yaml#/ErrorResponse'

  /api/v1/context/resolve:
    post:
      tags: [events, entities]
      summary: Resolve selected source records
      operationId: resolveContext
      parameters:
        - $ref: '../shared/parameters.yaml#/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveContextRequest'
      responses:
        '200':
          description: Current normalized data for every selected source record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveContextResponse'
        '400': { $ref: '../shared/responses.yaml#/BadRequest' }
        '401': { $ref: '../shared/responses.yaml#/Unauthorized' }
        '403': { $ref: '../shared/responses.yaml#/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/NotFound' }
        '422': { $ref: '../shared/responses.yaml#/ValidationError' }
        '502': { $ref: '../shared/responses.yaml#/BadGateway' }
        '504': { $ref: '../shared/responses.yaml#/GatewayTimeout' }
        '500': { $ref: '../shared/responses.yaml#/InternalError' }
        default:
          $ref: '../shared/responses.yaml#/ErrorResponse'

components:
  schemas:
    Event:
      type: object
      description: Security event normalized from one source record.
      required: [source_code, source_event_id, type, title, severity, occurred_at, entities, attributes, fetched_at]
      properties:
        source_code:
          type: string
          description: Code of the source that owns the event.
        source_event_id:
          type: string
          description: Original event identifier assigned by that source.
        source_ref:
          type: string
          format: uri
          description: Optional link to the event in its source system.
        type:
          type: string
          description: Normalized event class.
        title:
          type: string
          description: Short human-readable event summary.
        severity:
          type: string
          description: Severity mapped to the Gateway scale.
          enum: [info, low, medium, high, critical, unknown]
        occurred_at:
          type: string
          format: date-time
          description: Time when the event occurred in the source system.
        entities:
          type: array
          description: Canonical entities and their observed roles in this event.
          items:
            $ref: '../shared/schemas.yaml#/EntityMention'
        attributes:
          type: object
          description: Selected event fields that have no canonical top-level property.
          additionalProperties: true
        fetched_at:
          type: string
          format: date-time
          description: Time when the Gateway obtained the source data.

    ResolveContextRequest:
      type: object
      description: Source records selected by a client for persistence in an investigation.
      properties:
        findings:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '../shared/schemas.yaml#/SourceObjectRef'
        sessions:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '../shared/schemas.yaml#/SourceObjectRef'
        events:
          type: array
          maxItems: 500
          uniqueItems: true
          items:
            $ref: '../shared/schemas.yaml#/EventSourceRef'
        entities:
          type: array
          maxItems: 2000
          uniqueItems: true
          items:
            $ref: '../shared/schemas.yaml#/EntitySourceRef'

    ResolveContextResponse:
      type: object
      description: Normalized records and relationships resolved from source-owned identifiers.
      required: [findings, sessions, events, entities, relations, resolutions, source_errors]
      properties:
        findings:
          type: array
          items:
            $ref: './findings.yaml#/components/schemas/Finding'
        sessions:
          type: array
          items:
            $ref: './sessions.yaml#/components/schemas/Session'
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        entities:
          type: array
          items:
            $ref: '../shared/schemas.yaml#/Entity'
        relations:
          type: array
          items:
            $ref: '../shared/schemas.yaml#/Relation'
        resolutions:
          type: array
          description: Per-selected-object completeness. Missing root records are not represented as resolved objects.
          items:
            $ref: '#/components/schemas/ObjectResolution'
        source_errors:
          type: array
          items:
            $ref: '../shared/schemas.yaml#/SourceError'

    EventSort:
      type: object
      description: Field and direction used to order matching events or event groups.
      required: [field, direction]
      properties:
        field:
          type: string
          minLength: 1
          maxLength: 128
        direction:
          type: string
          enum: [asc, desc]

    AggregateEventsRequest:
      type: object
      description: Filters for source-local event group counts.
      required: [time_range, group_by]
      properties:
        sources:
          type: array
          uniqueItems: true
          description: Source codes to query; omit to use every allowed event source.
          items:
            type: string
        time_range:
          description: Required occurrence-time interval.
          allOf:
            - $ref: '../shared/schemas.yaml#/TimeRange'
        entities:
          type: array
          maxItems: 100
          description: Entity conditions; an event matches when it contains at least one listed entity.
          items:
            $ref: '../shared/schemas.yaml#/EntityRef'
        filter:
          type: string
          maxLength: 4096
          description: >-
            Bounded source predicate without a query pipeline. Pipeline separators,
            comments, and control characters are rejected.
        group_by:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          description: Allowlisted source event fields whose values form each group.
          items:
            type: string
            minLength: 1
            maxLength: 128
        sort:
          type: array
          maxItems: 8
          description: >-
            Ordered group sort rules. A field must be count or one of group_by;
            defaults to count descending.
          items:
            $ref: '#/components/schemas/EventSort'
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
          description: Maximum number of groups returned by each selected source.

    EventGroup:
      type: object
      description: One source-local group and its event count.
      required: [source_code, values, count]
      properties:
        source_code:
          type: string
          description: Source that calculated the group.
        values:
          type: array
          minItems: 1
          maxItems: 8
          description: Group values aligned by position with the request group_by fields.
          items:
            type: string
            nullable: true
            maxLength: 1024
        count:
          type: integer
          format: int64
          minimum: 0
          description: Number of source events in the group.

    AggregateEventsResponse:
      type: object
      description: Source-local event groups without cross-source merging.
      required: [groups, source_states, source_errors]
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/EventGroup'
        source_states:
          type: array
          items:
            $ref: '../shared/schemas.yaml#/SourceState'
        source_errors:
          type: array
          description: Per-source failures when at least one selected source succeeded.
          items:
            $ref: '../shared/schemas.yaml#/SourceError'

    SearchEventsRequest:
      type: object
      description: Filters for a normalized multi-source event search.
      required: [time_range]
      properties:
        sources:
          type: array
          uniqueItems: true
          description: Source codes to query; omit to use every allowed source with event search.
          items:
            type: string
        time_range:
          description: Required occurrence-time interval.
          allOf:
            - $ref: '../shared/schemas.yaml#/TimeRange'
        entities:
          type: array
          maxItems: 100
          description: Entity conditions; an event matches when it contains at least one listed entity.
          items:
            $ref: '../shared/schemas.yaml#/EntityRef'
        filter:
          type: string
          maxLength: 4096
          description: >-
            Bounded source predicate without a query pipeline. Currently supported by
            pt-maxpatrol-siem; pipeline separators and control characters are rejected.
        columns:
          type: array
          maxItems: 64
          uniqueItems: true
          description: >-
            Allowlisted source event fields to fetch and expose through canonical event
            fields or attributes. Currently supported by pt-maxpatrol-siem.
          items:
            type: string
            minLength: 1
            maxLength: 128
        sort:
          type: array
          maxItems: 8
          description: Ordered source event sort rules. Currently supported by pt-maxpatrol-siem.
          items:
            $ref: '#/components/schemas/EventSort'
        group_by:
          type: array
          maxItems: 8
          uniqueItems: true
          description: >-
            Allowlisted source fields whose selected group is searched. Currently supported
            by pt-maxpatrol-siem.
          items:
            type: string
            minLength: 1
            maxLength: 128
        group_values:
          type: array
          maxItems: 8
          description: >-
            Group values aligned by position with group_by. A null item selects the source
            null group. Currently supported by pt-maxpatrol-siem.
          items:
            type: string
            nullable: true
            maxLength: 1024
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
          description: Maximum number of events returned after merging all sources.
        cursor:
          type: string
          description: Opaque next_cursor from the previous response with the same filters.

    SearchEventsResponse:
      type: object
      description: Merged event page with the entities and relations needed to interpret it.
      required: [events, entities, relations, source_states, source_errors]
      properties:
        events:
          type: array
          description: Normalized events in the current page.
          items:
            $ref: '#/components/schemas/Event'
        entities:
          type: array
          description: Canonical entities referenced by the returned events.
          items:
            $ref: '../shared/schemas.yaml#/Entity'
        relations:
          type: array
          description: Relationships whose endpoints are present in the returned entities.
          items:
            $ref: '../shared/schemas.yaml#/Relation'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; absent when the search is exhausted.
        source_states:
          type: array
          items:
            $ref: '../shared/schemas.yaml#/SourceState'
        source_errors:
          type: array
          description: Per-source failures when at least one selected source succeeded.
          items:
            $ref: '../shared/schemas.yaml#/SourceError'

    ObjectResolution:
      type: object
      required: [ref, status, errors]
      properties:
        ref:
          $ref: '../shared/schemas.yaml#/SourceObjectRef'
        status:
          type: string
          enum: [complete, partial]
        errors:
          type: array
          items:
            $ref: '../shared/schemas.yaml#/SourceError'
