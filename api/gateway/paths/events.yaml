openapi: 3.0.3
info:
  title: Sb0rka Gateway - events
  version: 0.0.1
servers:
  - url: .
security:
  - bearerAuth: []

paths:
  /api/v1/events/search:
    post:
      tags: [events]
      summary: Search normalized events
      operationId: searchEvents
      parameters:
        - $ref: '../shared/parameters.yaml#/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchEventsRequest'
      responses:
        '200':
          description: Normalized events and their context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchEventsResponse'
        '400': { $ref: '../shared/responses.yaml#/BadRequest' }
        '401': { $ref: '../shared/responses.yaml#/Unauthorized' }
        '403': { $ref: '../shared/responses.yaml#/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/NotFound' }
        '422': { $ref: '../shared/responses.yaml#/ValidationError' }
        '502': { $ref: '../shared/responses.yaml#/BadGateway' }
        '504': { $ref: '../shared/responses.yaml#/GatewayTimeout' }
        '500': { $ref: '../shared/responses.yaml#/InternalError' }
        default:
          $ref: '../shared/responses.yaml#/ErrorResponse'

components:
  schemas:
    Event:
      type: object
      description: Security event normalized from one source record.
      required: [id, type, title, severity, occurred_at, entity_ids, attributes, provenance]
      properties:
        id:
          type: string
          format: uuid
          description: Deterministic identifier derived from the source and external event ID.
        type:
          type: string
          description: Normalized event class.
        title:
          type: string
          description: Short human-readable event summary.
        severity:
          type: string
          description: Severity mapped to the Gateway scale.
          enum: [info, low, medium, high, critical, unknown]
        occurred_at:
          type: string
          format: date-time
          description: Time when the event occurred in the source system.
        entity_ids:
          type: array
          description: Canonical entities mentioned by the event.
          items:
            type: string
            format: uuid
        attributes:
          type: object
          description: Selected event fields that have no canonical top-level property.
          additionalProperties: true
        provenance:
          description: Source record from which the event was normalized.
          allOf:
            - $ref: '../shared/schemas.yaml#/Provenance'

    TimeRange:
      type: object
      description: Inclusive event occurrence-time interval.
      required: [from, to]
      properties:
        from:
          type: string
          format: date-time
          description: Inclusive lower boundary of event occurrence time.
        to:
          type: string
          format: date-time
          description: Inclusive upper boundary of event occurrence time.

    SearchEventsRequest:
      type: object
      description: Filters for a normalized multi-source event search.
      properties:
        sources:
          type: array
          uniqueItems: true
          description: Source codes to query; omit to use every allowed source with event search.
          items:
            type: string
        time_range:
          description: Optional occurrence-time interval.
          allOf:
            - $ref: '#/components/schemas/TimeRange'
        query:
          type: string
          maxLength: 1000
          description: Free-text query interpreted by each selected source.
        entities:
          type: array
          maxItems: 100
          description: Entity conditions; an event matches when it contains at least one listed entity.
          items:
            $ref: '../shared/schemas.yaml#/EntityRef'
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
          description: Maximum number of events returned after merging all sources.
        cursor:
          type: string
          description: Opaque next_cursor from the previous response with the same filters.

    SearchEventsResponse:
      type: object
      description: Merged event page with the entities and relations needed to interpret it.
      required: [events, entities, relations, source_errors]
      properties:
        events:
          type: array
          description: Normalized events in the current page.
          items:
            $ref: '#/components/schemas/Event'
        entities:
          type: array
          description: Canonical entities referenced by the returned events.
          items:
            $ref: '../shared/schemas.yaml#/Entity'
        relations:
          type: array
          description: Relationships whose endpoints are present in the returned entities.
          items:
            $ref: '../shared/schemas.yaml#/Relation'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; absent when the search is exhausted.
        source_errors:
          type: array
          description: Per-source failures when at least one selected source succeeded.
          items:
            $ref: '../shared/schemas.yaml#/SourceError'
