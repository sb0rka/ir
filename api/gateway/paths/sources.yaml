openapi: 3.0.3
info:
  title: Sb0rka Gateway - sources
  version: 0.0.1
servers:
  - url: .
security:
  - agentBearer: []
  - bearerAuth: []
    configurationToken: []

paths:
  /api/v1/sources:
    get:
      tags: [sources]
      summary: List available sources
      description: Returns server-configured sources with usable project credentials. User requests read the current Platform configuration; agent requests use the encrypted copy synchronized by IR on save or reload. Missing or invalid credentials exclude a source without a vendor call. Authorization and availability are checked on every request; backend status probes use a short cache.
      operationId: listSources
      parameters:
        - $ref: '../shared/parameters.yaml#/ProjectId'
        - name: refresh
          in: query
          required: false
          description: Bypass cached backend statuses. Agent credentials still come from the configuration last saved or reloaded through IR.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Sources available to the selected project.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    description: Server-configured security products with usable credentials for this project.
                    items:
                      $ref: '#/components/schemas/Source'
        '401': { $ref: '../shared/responses.yaml#/Unauthorized' }
        '403': { $ref: '../shared/responses.yaml#/Forbidden' }
        '500': { $ref: '../shared/responses.yaml#/InternalError' }
        default:
          $ref: '../shared/responses.yaml#/ErrorResponse'

components:
  schemas:
    Capability:
      type: string
      description: Operation that a source can perform through the Gateway.
      enum: [findings, sessions, events, entity_lookup, artifact_analysis, endpoints, response_catalog, account_userinfo, evidence_payload, evidence_file]

    Source:
      type: object
      description: External security product registered in the Gateway.
      required: [code, name, kind, mode, status, capabilities]
      properties:
        code:
          type: string
          description: Stable source identifier used in requests and provenance.
        name:
          type: string
          description: Human-readable product name.
        kind:
          type: string
          description: Functional class of the security product.
          enum: [siem, ndr, edr, sandbox, threat_intelligence]
        mode:
          type: string
          description: Adapter mode currently backing the source.
          enum: [proxy]
        status:
          type: string
          description: Result of the current connection probe.
          enum: [online, degraded, offline]
        capabilities:
          type: array
          description: Operations implemented by this source.
          items:
            $ref: '#/components/schemas/Capability'
