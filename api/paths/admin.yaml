openapi: 3.0.3
info:
  title: IR — конфигурация и аудит
  version: 0.1.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []

paths:
  /sources:
    get:
      tags: [admin]
      summary: Источники улик
      description: Доступно всем ролям — фронту нужен список для фильтров и лейблов.
      operationId: listSources
      responses:
        '200':
          description: Источники
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Source' }
        '401': { $ref: '../shared/responses.yaml#/Unauthorized' }

  /extensions:
    get:
      tags: [admin]
      summary: Расширения обогащения
      description: Allowlist. Фронт показывает только разрешённые в карточке артефакта.
      operationId: listExtensions
      responses:
        '200':
          description: Расширения
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Extension' }
        '401': { $ref: '../shared/responses.yaml#/Unauthorized' }

  /linking-rules:
    get:
      tags: [admin]
      summary: Правила связывания
      operationId: listLinkingRules
      responses:
        '200':
          description: Правила
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LinkingRule' }
        '401': { $ref: '../shared/responses.yaml#/Unauthorized' }
        '403': { $ref: '../shared/responses.yaml#/Forbidden' }

  /linking-rules/{rule_code}:
    parameters:
      - { $ref: '../shared/parameters.yaml#/RuleCode' }
    patch:
      tags: [admin]
      summary: Изменить правило связывания
      description: |
        Правила — конфигурация, не код: набор признаков связывания задаёт заказчик.
        Изменение не переписывает уже созданные рёбра.
      operationId: updateLinkingRule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkingRulePatch' }
      responses:
        '200':
          description: Правило
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LinkingRule' }
        '401': { $ref: '../shared/responses.yaml#/Unauthorized' }
        '403': { $ref: '../shared/responses.yaml#/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/NotFound' }
        '422': { $ref: '../shared/responses.yaml#/ValidationError' }

  /roles:
    get:
      tags: [admin]
      summary: Роли субъектов тенанта
      operationId: listRoleBindings
      responses:
        '200':
          description: Роли
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RoleBinding' }
        '401': { $ref: '../shared/responses.yaml#/Unauthorized' }
        '403': { $ref: '../shared/responses.yaml#/Forbidden' }
    post:
      tags: [admin]
      summary: Назначить роль
      description: |
        Роли SOC (l1, l2, lead, admin) не совпадают с ролями проекта платформы —
        это отдельный вокабуляр, привязанный к субъекту в тенанте.
      operationId: createRoleBinding
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleBindingCreate' }
      responses:
        '201':
          description: Назначено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleBinding' }
        '401': { $ref: '../shared/responses.yaml#/Unauthorized' }
        '403': { $ref: '../shared/responses.yaml#/Forbidden' }
        '409': { $ref: '../shared/responses.yaml#/Conflict' }
        '422': { $ref: '../shared/responses.yaml#/ValidationError' }

  /roles/{subject_id}/{role}:
    parameters:
      - { $ref: '../shared/parameters.yaml#/SubjectId' }
      - name: role
        in: path
        required: true
        schema:
          type: string
          enum: [l1, l2, lead, admin]
    delete:
      tags: [admin]
      summary: Снять роль
      operationId: deleteRoleBinding
      responses:
        '204': { description: Снято }
        '401': { $ref: '../shared/responses.yaml#/Unauthorized' }
        '403': { $ref: '../shared/responses.yaml#/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/NotFound' }

  /audit:
    get:
      tags: [admin]
      summary: Журнал действий
      description: |
        Действия пользователей, агентов и системы. Append-only, только чтение.
        Фильтр по investigation_id — журнал одного расследования.
      operationId: listAudit
      parameters:
        - { name: investigation_id, in: query, schema: { type: string, format: uuid } }
        - { name: actor_type, in: query, schema: { type: string, enum: [user, agent, system] } }
        - { name: action, in: query, schema: { type: string } }
        - { name: external_call, in: query, description: Только вызовы наружу, schema: { type: boolean } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { $ref: '../shared/parameters.yaml#/Limit' }
        - { $ref: '../shared/parameters.yaml#/Cursor' }
      responses:
        '200':
          description: Страница журнала
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '401': { $ref: '../shared/responses.yaml#/Unauthorized' }
        '403': { $ref: '../shared/responses.yaml#/Forbidden' }
        '422': { $ref: '../shared/responses.yaml#/ValidationError' }

  /investigations/{investigation_id}/metrics:
    parameters:
      - { $ref: '../shared/parameters.yaml#/InvestigationId' }
    get:
      tags: [admin]
      summary: Метрики расследования
      description: Счётчики из журнала действий для оценки сокращения ручных шагов.
      operationId: getInvestigationMetrics
      responses:
        '200':
          description: Метрики
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvestigationMetrics' }
        '401': { $ref: '../shared/responses.yaml#/Unauthorized' }
        '403': { $ref: '../shared/responses.yaml#/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/NotFound' }

  /health:
    get:
      tags: [admin]
      summary: Состояние источников и расширений
      description: >-
        Плашка в интерфейсе — недоступность источника видна аналитику,
        а не молча ломает выборку.
      operationId: getHealth
      responses:
        '200':
          description: Состояние
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                properties:
                  sources:
                    type: array
                    items: { $ref: '#/components/schemas/SourceHealth' }
        '401': { $ref: '../shared/responses.yaml#/Unauthorized' }

components:
  schemas:
    AuditEntry:
      type: object
      description: |
        Журнал действий пользователя, агента и системы. Append-only.
        Источник метрики сокращения числа шагов.
      required: [id, actor_type, actor_id, action, ts]
      properties:
        id: { type: integer, format: int64 }
        investigation_id: { type: string, format: uuid, nullable: true }
        actor_type:
          type: string
          enum: [user, agent, system]
        actor_id: { type: string }
        action: { type: string }
        payload:
          type: object
          additionalProperties: true
        external_call:
          type: boolean
          description: Данные ушли во внешний сервис
        ts: { type: string, format: date-time }
    AuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEntry' }
        next_cursor: { type: string, nullable: true }
    Extension:
      type: object
      description: Расширение обогащения (MCP/skill). По умолчанию выключено — allowlist.
      required: [code, kind, title, is_allowed, sends_data_externally]
      properties:
        code: { type: string }
        kind:
          type: string
          enum: [mcp, skill, a2a]
        title: { type: string }
        is_allowed: { type: boolean }
        sends_data_externally:
          type: boolean
          description: Признак «данные уходят наружу» — требует согласования (п.6.4 ТЗ)
    InvestigationMetrics:
      type: object
      description: |
        Счётчики из журнала действий для метрики сокращения ручных шагов.
        baseline_steps задаётся при фиксации эталонного прогона.
      required: [investigation_id, actions, elapsed_seconds]
      properties:
        investigation_id: { type: string, format: uuid }
        actions: { type: integer, description: Действий аналитика в расследовании }
        elapsed_seconds: { type: integer }
        agent_actions: { type: integer }
        events_attached: { type: integer }
        edges_proposed: { type: integer }
        edges_confirmed: { type: integer }
        baseline_steps:
          type: integer
          nullable: true
          description: Шагов в исходных консолях, если эталон зафиксирован
        reduction:
          type: number
          nullable: true
          description: (baseline_steps − actions) / baseline_steps
    LinkingRule:
      type: object
      description: |
        Правило связывания — детерминированный не-LLM путь построения рёбер.
        Система строит граф без агента (инвариант И-4).
      required: [code, title, kind, born_status, is_enabled]
      properties:
        code: { type: string }
        title: { type: string }
        kind:
          type: string
          enum: [chain-join, identity-join, temporal-join, pair-join]
        rule:
          type: object
          additionalProperties: true
          description: match, window_sec, relation_code, confidence
        born_status:
          $ref: '../shared/enums.yaml#/EdgeStatus'
        is_enabled: { type: boolean }
    LinkingRulePatch:
      type: object
      properties:
        title: { type: string }
        rule:
          type: object
          additionalProperties: true
        born_status: { $ref: '../shared/enums.yaml#/EdgeStatus' }
        is_enabled: { type: boolean }
    RoleBinding:
      type: object
      description: Роль субъекта платформы в тенанте. Вокабуляр SOC, не платформенный.
      required: [subject_id, role]
      properties:
        subject_id: { type: string, format: uuid }
        role:
          type: string
          enum: [l1, l2, lead, admin]
        granted_by_subject_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
    RoleBindingCreate:
      type: object
      required: [subject_id, role]
      properties:
        subject_id: { type: string, format: uuid }
        role:
          type: string
          enum: [l1, l2, lead, admin]
    Source:
      type: object
      description: Источник улик. Секреты не возвращаются — только ссылка secret_ref.
      required: [code, kind, title, is_enabled]
      properties:
        code: { type: string }
        kind:
          type: string
          enum: [siem, edr, ndr, infra, sandbox, other]
        title: { type: string }
        secret_ref: { type: string, nullable: true }
        is_enabled: { type: boolean }
    SourceHealth:
      type: object
      required: [code, status]
      properties:
        code: { type: string }
        status:
          type: string
          enum: [ok, degraded, unavailable]
        last_ok_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string, nullable: true }
        checked_at: { type: string, format: date-time }
