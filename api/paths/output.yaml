openapi: 3.0.3
info:
  title: IR — отчёты и пакет
  version: 0.1.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []

paths:
  /investigations/{investigation_id}/response-packages:
    parameters:
      - { $ref: '../shared/parameters.yaml#/components/parameters/InvestigationId' }
    post:
      tags: [output]
      summary: Собрать пакет реагирования
      description: |
        Включаются только подтверждённые артефакты. Пустой artifact_ids — все
        подтверждённые артефакты расследования и его поддерева.
      operationId: createResponsePackage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResponsePackageCreate' }
      responses:
        '201':
          description: Черновик пакета
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResponsePackage' }
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
        '422': { $ref: '../shared/responses.yaml#/components/responses/ValidationError' }
  /response-packages/{package_id}:
    parameters:
      - { $ref: '../shared/parameters.yaml#/components/parameters/PackageId' }
    get:
      tags: [output]
      summary: Пакет реагирования
      operationId: getResponsePackage
      responses:
        '200':
          description: Пакет
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResponsePackage' }
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
    patch:
      tags: [output]
      summary: Зафиксировать пакет
      description: Перевод в final. Финальный пакет неизменяем — повторный PATCH вернёт 409.
      operationId: finalizeResponsePackage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResponsePackagePatch' }
      responses:
        '200':
          description: Пакет
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResponsePackage' }
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
        '409': { $ref: '../shared/responses.yaml#/components/responses/Conflict' }
        '422': { $ref: '../shared/responses.yaml#/components/responses/ValidationError' }

  /investigations/{investigation_id}/reports:
    parameters:
      - { $ref: '../shared/parameters.yaml#/components/parameters/InvestigationId' }
    post:
      tags: [output]
      summary: Сгенерировать отчёт по инциденту
      description: |
        Генерация асинхронная: возвращается запись со status=pending, файл
        появляется в storage_ref. Содержимое собирается из подтверждённых данных;
        отклонённые ветки входят как «проверено и исключено».
      operationId: createReport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportCreate' }
      responses:
        '202':
          description: Принято в работу
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
        '422': { $ref: '../shared/responses.yaml#/components/responses/ValidationError' }
  /reports/{report_id}:
    parameters:
      - { $ref: '../shared/parameters.yaml#/components/parameters/ReportId' }
    get:
      tags: [output]
      summary: Статус отчёта
      operationId: getReport
      responses:
        '200':
          description: Отчёт
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }

  /reports/{report_id}/content:
    parameters:
      - { $ref: '../shared/parameters.yaml#/components/parameters/ReportId' }
    get:
      tags: [output]
      summary: Скачать отчёт
      operationId: downloadReport
      responses:
        '200':
          description: Файл отчёта
          content:
            text/markdown:
              schema: { type: string }
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
        '409':
          description: Отчёт ещё не готов или сборка упала (code=conflict)
          content:
            application/json:
              schema: { $ref: '../shared/errors.yaml#/components/schemas/ErrorResponse' }

components:
  schemas:
    Report:
      type: object
      description: |
        Отчёт по инциденту. Формируется из подтверждённых данных; отклонённые ветки
        входят как «проверено и исключено». snapshot фиксирует данные на момент
        генерации — отчёт воспроизводим.
      required: [id, investigation_id, format, status, created_at]
      properties:
        id: { type: string, format: uuid }
        investigation_id: { type: string, format: uuid }
        format:
          type: string
          enum: [markdown, pdf]
        status:
          type: string
          enum: [pending, ready, failed]
        storage_ref: { type: string, nullable: true, description: Ссылка на файл в object storage }
        error: { type: string, nullable: true }
        created_by_subject_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
    ReportCreate:
      type: object
      properties:
        format:
          type: string
          enum: [markdown, pdf]
          default: markdown
        include_subtree:
          type: boolean
          default: true
          description: Включить под-расследования с их вердиктами
        include_rejected:
          type: boolean
          default: true
          description: «Проверено и исключено» — отклонённые ветки с причинами
    ResponsePackage:
      type: object
      description: |
        Пакет реагирования: только подтверждённые артефакты расследования,
        в формате, пригодном для загрузки в EDR заказчика.
      required: [id, investigation_id, status, format, created_at]
      properties:
        id: { type: string, format: uuid }
        investigation_id: { type: string, format: uuid }
        status:
          type: string
          enum: [draft, final]
        format:
          type: string
          enum: [json, csv, stix]
        items:
          type: array
          items: { $ref: '#/components/schemas/ResponsePackageItem' }
        created_by_subject_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        exported_at: { type: string, format: date-time, nullable: true }
    ResponsePackageCreate:
      type: object
      properties:
        format:
          type: string
          enum: [json, csv, stix]
          default: json
        artifact_ids:
          type: array
          description: Пусто — включить все подтверждённые артефакты расследования
          items: { type: string, format: uuid }
    ResponsePackageItem:
      type: object
      required: [artifact_id, type_code, value]
      properties:
        artifact_id: { type: string, format: uuid }
        type_code: { type: string }
        value: { type: string }
        node:
          type: string
          nullable: true
          description: Узел, на котором индикатор наблюдался
    ResponsePackagePatch:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [final]
          description: Фиксация пакета. Final неизменяем
