openapi: 3.0.3
info:
  title: IR — evidence
  version: 0.1.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []

paths:
  /investigations/{investigation_id}/events:
    parameters:
      - { $ref: '../shared/parameters.yaml#/components/parameters/InvestigationId' }
    get:
      tags: [events]
      summary: Timeline of the investigation
      description: >-
        Events already pulled into the case, oldest first. Ordered by
        occurred_at then id, which is what makes the cursor stable when several
        events share a timestamp. Raw payloads are omitted here — fetch a single
        event for those.
      operationId: listEvents
      parameters:
        - name: event_type
          in: query
          description: Keep only events of this kind, e.g. process_start or network_session.
          schema: { type: string }
        - name: source_code
          in: query
          description: Keep only events from one source — siem, edr, ndr, infra.
          schema: { type: string }
        - name: entity_id
          in: query
          description: >-
            Keep only events this entity takes part in. This is how the UI
            answers "what happened on that host".
          schema: { type: string, format: uuid }
        - name: from
          in: query
          description: Lower bound on occurred_at, inclusive.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Upper bound on occurred_at, exclusive.
          schema: { type: string, format: date-time }
        - name: q
          in: query
          description: >-
            Substring match over the normalised payload — command lines,
            paths, addresses.
          schema: { type: string }
        - { $ref: '../shared/parameters.yaml#/components/parameters/Limit' }
        - { $ref: '../shared/parameters.yaml#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page of the timeline
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventPage' }
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
        '422': { $ref: '../shared/responses.yaml#/components/responses/ValidationError' }

  /events:
    post:
      tags: [events]
      summary: Pull events into an investigation
      description: >-
        The way data enters the product. Takes either explicit references to
        source records or a query to run against a source. Each event is
        normalised, its entities are extracted, graph nodes are created and
        linking rules run — so the graph grows without an agent being involved.

        A record already ingested for this tenant is linked, not copied: the
        event keeps one identity across every case that touches it, which is
        what lets the entity card say where else something has been seen.
        Idempotent — re-pulling into the same case changes nothing. Up to 500
        events per call; a larger selection has to be split.
      operationId: attachEvents
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventAttachRequest' }
      responses:
        '201':
          description: What the pull produced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventAttachResult' }
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
        '409': { $ref: '../shared/responses.yaml#/components/responses/Conflict' }
        '422': { $ref: '../shared/responses.yaml#/components/responses/ValidationError' }
        '502': { $ref: '../shared/responses.yaml#/components/responses/SourceUnavailable' }

  /events/{event_id}:
    parameters:
      - { $ref: '../shared/parameters.yaml#/components/parameters/EventId' }
    get:
      tags: [events]
      summary: One event in full
      description: >-
        The whole record, including the raw source payload and the link back to
        the originating console. This is the end of the provenance chain: every
        finding leads here, and here leads to the source system.
      operationId: getEvent
      responses:
        '200':
          description: The event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
    delete:
      tags: [events]
      summary: Delete an event from the tenant
      description: >-
        Erases the event everywhere. Almost never what is wanted — to remove it
        from one case delete the membership instead, which leaves the event and
        the other cases alone.

        Refused while the event is attached to any investigation, so this only
        ever applies to something ingested by mistake and not yet used.
      operationId: deleteEvent
      responses:
        '204':
          description: Dropped
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
        '409': { $ref: '../shared/responses.yaml#/components/responses/Conflict' }

  /events/{event_id}/investigations/{investigation_id}:
    parameters:
      - { $ref: '../shared/parameters.yaml#/components/parameters/EventId' }
      - { $ref: '../shared/parameters.yaml#/components/parameters/InvestigationId' }
    delete:
      tags: [events]
      summary: Drop an event from the investigation
      description: >-
        Undoes a pull that brought in the wrong thing. The event leaves this
        timeline, its node on this graph goes with it, and so do the edges that
        hung off that node.

        The event itself survives, along with its place in every other case —
        which is the point of events being shared rather than copied. Refused
        while a confirmed edge of this case cites it: removing it would leave an
        established claim resting on nothing.
      operationId: detachEvent
      responses:
        '204':
          description: Dropped from the investigation
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
        '409': { $ref: '../shared/responses.yaml#/components/responses/Conflict' }

components:
  schemas:
    Event:
      type: object
      description: >-
        A fact from a security tool. Events are never edited and carry no
        status: a fact cannot be confirmed or rejected, only cited.

        An event belongs to the tenant, not to one investigation — the same
        source record routinely turns up in several cases, and copying it into
        each would destroy the answer to "where else has this been seen".
        Membership is a separate link, so pulling an event into a third case
        adds a relation rather than a duplicate.
      required: [id, source_code, source_event_id, event_type, occurred_at, ingested_at]
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the event within the tenant.
        investigation_ids:
          type: array
          description: >-
            Investigations this event has been pulled into. More than one is
            normal and is itself a signal: the same record appearing in several
            cases suggests they are related.
          items: { type: string, format: uuid }
        source_code:
          type: string
          description: Which tool it came from — siem, edr, ndr, infra.
        source_event_id:
          type: string
          description: >-
            Identifier of the record in that tool. Stable address for going
            back to the original.
        source_ref:
          type: string
          nullable: true
          description: >-
            Ready-made link or query that opens the record in the source
            console. What turns "we claim" into "go and check".
        event_type:
          type: string
          description: >-
            What happened, in the product's vocabulary — process_start,
            network_session, logon, detection.
        occurred_at:
          type: string
          format: date-time
          description: When it happened, per the source. This is what the timeline sorts by.
        ingested_at:
          type: string
          format: date-time
          description: >-
            When it was pulled in. Differs from occurred_at whenever an analyst
            reaches back in time, which is most of the time.
        normalized_data:
          type: object
          description: >-
            The event mapped onto the common envelope — subject, action, object,
            status — so events from different tools can be compared and searched.
          additionalProperties: true
        raw_data:
          type: object
          nullable: true
          description: >-
            Original payload as the source returned it. Kept for the cases where
            normalisation lost something. Omitted from list responses.
          additionalProperties: true
        entities:
          type: array
          description: >-
            Who took part and in what capacity. Extracted during ingestion by
            the source's mapping profile.
          items:
            type: object
            required: [entity_id, relation_code]
            properties:
              entity_id:
                type: string
                format: uuid
                description: The participating entity.
              relation_code:
                type: string
                description: >-
                  Its role in the event — actor, object, src, dst. The same
                  entity may appear twice with different roles.

    EventSummary:
      type: object
      description: >-
        Event without the raw payload. A timeline page carries hundreds of
        events and raw payloads run to kilobytes each; the full record is
        available one at a time.
      required: [id, source_code, source_event_id, event_type, occurred_at, ingested_at]
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the event within the tenant.
        attached_at:
          type: string
          format: date-time
          description: >-
            When the event was pulled into the investigation being listed.
            A property of the membership, not of the event — the same event has
            a different value in another case.
        attached_by:
          allOf: [{ $ref: '../shared/enums.yaml#/components/schemas/Actor' }]
          description: Who pulled it into this investigation.
        reason:
          type: string
          nullable: true
          description: >-
            Why it was pulled in. Part of the case narrative, and likewise
            per-investigation.
        source_code:
          type: string
          description: Which tool it came from.
        source_event_id:
          type: string
          description: Identifier of the record in that tool.
        source_ref:
          type: string
          nullable: true
          description: Link that opens the record in the source console.
        event_type:
          type: string
          description: What happened, in the product's vocabulary.
        occurred_at:
          type: string
          format: date-time
          description: When it happened, per the source.
        ingested_at:
          type: string
          format: date-time
          description: When it was pulled into the investigation.
        normalized_data:
          type: object
          description: The event mapped onto the common envelope.
          additionalProperties: true
        entities:
          type: array
          description: Who took part and in what capacity.
          items:
            type: object
            required: [entity_id, relation_code]
            properties:
              entity_id:
                type: string
                format: uuid
                description: The participating entity.
              relation_code:
                type: string
                description: Its role in the event.

    EventAttachRequest:
      type: object
      description: >-
        What to pull and where to. Give either refs, when the records are
        already known, or query, to let the source find them — exactly one of
        the two.
      required: [investigation_id]
      properties:
        investigation_id:
          type: string
          format: uuid
          description: >-
            Investigation to pull the events into. The events themselves belong
            to the tenant, so this says where they should show up, not who owns
            them.
        refs:
          type: array
          maxItems: 500
          description: >-
            Records addressed directly. Used when the analyst has already picked
            them out, or when an agent cites what it found.
          items:
            type: object
            required: [source_code, source_event_id]
            properties:
              source_code:
                type: string
                description: Which tool holds the record.

              source_event_id:
                type: string
                description: Its identifier in that tool.
        query:
          type: object
          description: >-
            A selection to run against one source. This is the pivot: give it an
            entity key and a window, and whatever the source returns lands in
            the case.
          required: [source_code]
          properties:
            source_code:
              type: string
              description: Which source to query.
            entity_key:
              type: string
              description: >-
                Value to pivot on — a hostname, account, address or hash.
                Matched against the source's own fields.
            from:
              type: string
              format: date-time
              description: Lower bound of the time window, inclusive.
            to:
              type: string
              format: date-time
              description: Upper bound of the time window, exclusive.
            substring:
              type: string
              description: Free-text fragment to match, for cases a key cannot express.
            limit:
              type: integer
              maximum: 500
              default: 100
              description: Cap on records to pull. The hard ceiling is 500 per call.
        reason:
          type: string
          description: >-
            Why this was pulled. Goes into the audit log and into the case
            narrative — the record of what the analyst was thinking.

    EventAttachResult:
      type: object
      description: What the pull changed in the investigation.
      required: [attached, duplicates, entities_extracted, edges_created]
      properties:
        attached:
          type: integer
          description: Events newly added to the case, whether ingested now or already known.
        reused:
          type: integer
          description: >-
            Of those, how many already existed for the tenant and were linked
            rather than ingested. Non-zero means this case overlaps another —
            worth a look.
        duplicates:
          type: integer
          description: >-
            Events already in this case and therefore skipped. Normal, not an
            error: overlapping pulls are expected.
        entities_extracted:
          type: integer
          description: >-
            Entities created or updated from the new events. Counts entities,
            not mentions.
        edges_created:
          type: integer
          description: >-
            Edges linking rules produced from the new events. This is the graph
            growing without an agent: rules alone connect what obviously belongs
            together.

    EventPage:
      type: object
      description: One page of the timeline.
      required: [items]
      properties:
        items:
          type: array
          description: Events, oldest first.
          items: { $ref: '#/components/schemas/EventSummary' }
        next_cursor:
          type: string
          nullable: true
          description: >-
            Pass as `cursor` to get the next page. Absent on the last page —
            that, not an empty page, is how iteration ends.
