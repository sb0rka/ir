openapi: 3.0.3
info:
  title: IR — evidence
  version: 0.1.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []

paths:
  /investigations/{investigation_id}/events:
    parameters:
      - { $ref: '../shared/parameters.yaml#/components/parameters/ProjectId' }
      - { $ref: '../shared/parameters.yaml#/components/parameters/InvestigationId' }
    get:
      tags: [events]
      summary: Timeline of the investigation
      description: >-
        Events linked to the investigation, ordered by occurred_at and id. Raw
        payloads are available from the single-event endpoint.
      operationId: listEvents
      parameters:
        - name: event_type
          in: query
          description: Keep only events of this kind, e.g. process_start or network_session.
          schema: { type: string }
        - name: source_code
          in: query
          description: Keep only events from one source — siem, edr, ndr, infra.
          schema: { type: string }
        - name: entity_id
          in: query
          description: >-
            Keep only events this entity takes part in. This is how the UI
            answers "what happened on that host".
          schema: { type: string, format: uuid }
        - name: from
          in: query
          description: Lower bound on occurred_at, inclusive.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Upper bound on occurred_at, exclusive.
          schema: { type: string, format: date-time }
        - name: q
          in: query
          description: >-
            Substring match over the normalised payload — command lines,
            paths, addresses.
          schema: { type: string }
        - { $ref: '../shared/parameters.yaml#/components/parameters/Limit' }
        - { $ref: '../shared/parameters.yaml#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page of the timeline
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventPage' }
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '500': { $ref: '../shared/responses.yaml#/components/responses/InternalError' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
        '422': { $ref: '../shared/responses.yaml#/components/responses/ValidationError' }

  /events:
    parameters:
      - { $ref: '../shared/parameters.yaml#/components/parameters/ProjectId' }
    post:
      tags: [events]
      summary: Pull events into an investigation
      description: >-
        Ingests events from explicit source references or a source query, then
        links them to an investigation. Existing tenant events are reused.
        Repeated links are ignored; a request may include at most 500 events.
      operationId: attachEvents
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventAttachRequest' }
      responses:
        '201':
          description: What the pull produced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventAttachResult' }
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '500': { $ref: '../shared/responses.yaml#/components/responses/InternalError' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
        '409': { $ref: '../shared/responses.yaml#/components/responses/Conflict' }
        '422': { $ref: '../shared/responses.yaml#/components/responses/ValidationError' }
        '502': { $ref: '../shared/responses.yaml#/components/responses/SourceUnavailable' }

  /events/{event_id}:
    parameters:
      - { $ref: '../shared/parameters.yaml#/components/parameters/ProjectId' }
      - { $ref: '../shared/parameters.yaml#/components/parameters/EventId' }
    get:
      tags: [events]
      summary: One event in full
      description: Returns the normalized event, raw payload and source link.
      operationId: getEvent
      responses:
        '200':
          description: The event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '500': { $ref: '../shared/responses.yaml#/components/responses/InternalError' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
    delete:
      tags: [events]
      summary: Delete an event from the tenant
      description: >-
        Deletes a tenant event. Returns 409 while it is linked to any
        investigation.
      operationId: deleteEvent
      responses:
        '204':
          description: Dropped
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '500': { $ref: '../shared/responses.yaml#/components/responses/InternalError' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
        '409': { $ref: '../shared/responses.yaml#/components/responses/Conflict' }

  /events/{event_id}/investigations/{investigation_id}:
    parameters:
      - { $ref: '../shared/parameters.yaml#/components/parameters/ProjectId' }
      - { $ref: '../shared/parameters.yaml#/components/parameters/EventId' }
      - { $ref: '../shared/parameters.yaml#/components/parameters/InvestigationId' }
    delete:
      tags: [events]
      summary: Drop an event from the investigation
      description: >-
        Removes the investigation link, graph node and connected edges. The
        tenant event remains. Returns 409 if a confirmed edge cites the event.
      operationId: detachEvent
      responses:
        '204':
          description: Dropped from the investigation
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '500': { $ref: '../shared/responses.yaml#/components/responses/InternalError' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
        '409': { $ref: '../shared/responses.yaml#/components/responses/Conflict' }

components:
  schemas:
    Event:
      type: object
      description: >-
        An immutable tenant event. Investigation membership is stored
        separately, so one event may be linked to multiple investigations.
      required: [id, source_code, source_event_id, event_type, occurred_at, ingested_at]
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the event within the tenant.
        investigation_ids:
          type: array
          description: Investigations linked to this event.
          items: { type: string, format: uuid }
        source_code:
          type: string
          description: Which tool it came from — siem, edr, ndr, infra.
        source_event_id:
          type: string
          description: >-
            Identifier of the record in that tool. Stable address for going
            back to the original.
        source_ref:
          type: string
          nullable: true
          description: Link or query that opens the source record.
        event_type:
          type: string
          description: Normalized event type, such as process_start or logon.
        occurred_at:
          type: string
          format: date-time
          description: When it happened, per the source. This is what the timeline sorts by.
        ingested_at:
          type: string
          format: date-time
          description: When the event was ingested.
        normalized_data:
          type: object
          description: >-
            The event mapped onto the common envelope — subject, action, object,
            status — so events from different tools can be compared and searched.
          additionalProperties: true
        raw_data:
          type: object
          nullable: true
          description: Original source payload. Omitted from list responses.
          additionalProperties: true
        entities:
          type: array
          description: >-
            Who took part and in what capacity. Extracted during ingestion by
            the source's mapping profile.
          items:
            type: object
            required: [entity_id, relation_code]
            properties:
              entity_id:
                type: string
                format: uuid
                description: The participating entity.
              relation_code:
                type: string
                description: >-
                  Its role in the event — actor, object, src, dst. The same
                  entity may appear twice with different roles.

    EventSummary:
      type: object
      description: Event without the raw payload.
      required: [id, source_code, source_event_id, event_type, occurred_at, ingested_at]
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the event within the tenant.
        attached_at:
          type: string
          format: date-time
          description: >-
            When the event was pulled into the investigation being listed.
            A property of the membership, not of the event — the same event has
            a different value in another case.
        attached_by:
          allOf: [{ $ref: '../shared/enums.yaml#/components/schemas/Actor' }]
          description: Who pulled it into this investigation.
        reason:
          type: string
          nullable: true
          description: Explanation stored on the investigation-event link.
        source_code:
          type: string
          description: Which tool it came from.
        source_event_id:
          type: string
          description: Identifier of the record in that tool.
        source_ref:
          type: string
          nullable: true
          description: Link that opens the record in the source console.
        event_type:
          type: string
          description: Normalized event type.
        occurred_at:
          type: string
          format: date-time
          description: When it happened, per the source.
        ingested_at:
          type: string
          format: date-time
          description: When it was pulled into the investigation.
        normalized_data:
          type: object
          description: The event mapped onto the common envelope.
          additionalProperties: true
        entities:
          type: array
          description: Who took part and in what capacity.
          items:
            type: object
            required: [entity_id, relation_code]
            properties:
              entity_id:
                type: string
                format: uuid
                description: The participating entity.
              relation_code:
                type: string
                description: Its role in the event.

    EventAttachRequest:
      type: object
      description: >-
        Events to ingest and link. Exactly one of refs and query must be set.
      required: [investigation_id]
      properties:
        investigation_id:
          type: string
          format: uuid
          description: Investigation to link the events to.
        refs:
          type: array
          maxItems: 500
          description: >-
            Records addressed directly. Used when the analyst has already picked
            them out, or when an agent cites what it found.
          items:
            type: object
            required: [source_code, source_event_id]
            properties:
              source_code:
                type: string
                description: Which tool holds the record.

              source_event_id:
                type: string
                description: Its identifier in that tool.
        query:
          type: object
          description: Selection to run against one source.
          required: [source_code]
          properties:
            source_code:
              type: string
              description: Which source to query.
            entity_key:
              type: string
              description: >-
                Value to pivot on — a hostname, account, address or hash.
                Matched against the source's own fields.
            from:
              type: string
              format: date-time
              description: Lower bound of the time window, inclusive.
            to:
              type: string
              format: date-time
              description: Upper bound of the time window, exclusive.
            substring:
              type: string
              description: Free-text fragment to match, for cases a key cannot express.
            limit:
              type: integer
              maximum: 500
              default: 100
              description: Cap on records to pull. The hard ceiling is 500 per call.
        reason:
          type: string
          description: Explanation stored on the investigation-event link.

    EventAttachResult:
      type: object
      description: What the pull changed in the investigation.
      required: [attached, duplicates, entities_extracted, edges_created]
      properties:
        attached:
          type: integer
          description: Events newly added to the case, whether ingested now or already known.
        reused:
          type: integer
          description: Existing tenant events newly linked to the investigation.
        duplicates:
          type: integer
          description: Events already linked to the investigation and skipped.
        entities_extracted:
          type: integer
          description: >-
            Entities created or updated from the new events. Counts entities,
            not mentions.
        edges_created:
          type: integer
          description: Edges created by linking rules.

    EventPage:
      type: object
      description: One page of the timeline.
      required: [items]
      properties:
        items:
          type: array
          description: Events, oldest first.
          items: { $ref: '#/components/schemas/EventSummary' }
        next_cursor:
          type: string
          nullable: true
          description: >-
            Pass as `cursor` to get the next page. Absent on the last page —
            that, not an empty page, is how iteration ends.
