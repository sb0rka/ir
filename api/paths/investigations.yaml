openapi: 3.0.3
info:
  title: IR — investigations
  version: 0.1.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []

paths:
  /investigations:
    post:
      tags: [investigations]
      summary: Open an investigation or a hypothesis under one
      description: >-
        A root investigation is a case. A child is a hypothesis inside it —
        "the account was compromised", "this was the initial access". The tree
        is the same object at every level, so a hypothesis that grows can carry
        its own children without being converted into anything.
      operationId: createInvestigation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvestigationCreate' }
      responses:
        '201':
          description: The new investigation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Investigation' }
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404':
          description: The parent named in parent_id does not exist in this tenant.
          content:
            application/json:
              schema: { $ref: '../shared/errors.yaml#/components/schemas/ErrorResponse' }
        '422': { $ref: '../shared/responses.yaml#/components/responses/ValidationError' }
    get:
      tags: [investigations]
      summary: List investigations
      description: >-
        Root cases by default, or the direct children of one. Only one level at
        a time — fetch the tree endpoint when the whole subtree is needed.
      operationId: listInvestigations
      parameters:
        - name: parent_id
          in: query
          description: >-
            Return the direct children of this investigation instead of the
            roots. Omit it for the case list.
          schema: { type: string, format: uuid }
        - name: status
          in: query
          description: Keep only open or only closed investigations.
          schema: { $ref: '#/components/schemas/InvestigationStatus' }
        - name: severity
          in: query
          description: Keep only investigations of this severity.
          schema: { $ref: '../shared/enums.yaml#/components/schemas/Severity' }
        - name: q
          in: query
          description: Substring match on the title.
          schema: { type: string }
        - { $ref: '../shared/parameters.yaml#/components/parameters/Limit' }
        - { $ref: '../shared/parameters.yaml#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page of investigations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvestigationPage' }
              example:
                items:
                  - id: 1a2b3c4d-0000-4000-8000-000000000001
                    project_id: 9f3c1a7b2e
                    parent_id: null
                    title: Подозрительная активность на dc-01
                    description: >-
                      Сервисная учётка svc-backup залогинилась на контроллер
                      домена вне окна резервного копирования.
                    status: open
                    severity: high
                    origin: analyst
                    origin_ref: 7c9e6b21-0000-4000-8000-0000000000aa
                    version: 3
                    counters: { children: 2, events: 3, entities: 4, proposed_edges: 1 }
                    created_at: '2026-07-24T08:55:00Z'
                    updated_at: '2026-07-24T10:15:20Z'
                  - id: 1a2b3c4d-0000-4000-8000-000000000004
                    project_id: 9f3c1a7b2e
                    parent_id: null
                    title: Фишинговая рассылка в бухгалтерию
                    status: closed
                    severity: medium
                    verdict: false_positive
                    verdict_reason: Рассылка легитимная, отправитель подтверждён по телефону.
                    origin: analyst
                    version: 5
                    counters: { children: 0, events: 12, entities: 6, proposed_edges: 0 }
                    created_at: '2026-07-22T11:20:00Z'
                    updated_at: '2026-07-22T16:04:12Z'
                    closed_at: '2026-07-22T16:04:12Z'
                next_cursor: null
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '422': { $ref: '../shared/responses.yaml#/components/responses/ValidationError' }

  /investigations/{investigation_id}:
    parameters:
      - { $ref: '../shared/parameters.yaml#/components/parameters/InvestigationId' }
    get:
      tags: [investigations]
      summary: One investigation
      description: >-
        The investigation with its counters — how much evidence it holds and how
        much still waits for review.
      operationId: getInvestigation
      responses:
        '200':
          description: The investigation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Investigation' }
              example:
                id: 1a2b3c4d-0000-4000-8000-000000000001
                project_id: 9f3c1a7b2e
                parent_id: null
                title: Подозрительная активность на dc-01
                description: >-
                  Сервисная учётка svc-backup залогинилась на контроллер домена
                  вне окна резервного копирования.
                status: open
                severity: high
                origin: analyst
                origin_ref: 7c9e6b21-0000-4000-8000-0000000000aa
                version: 3
                counters: { children: 2, events: 3, entities: 4, proposed_edges: 1 }
                created_at: '2026-07-24T08:55:00Z'
                updated_at: '2026-07-24T10:15:20Z'
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
    patch:
      tags: [investigations]
      summary: Update an investigation
      description: >-
        Edits the fields sent and nothing else. Closing requires a verdict, and
        rejecting requires a stated reason — a case cannot be closed silently.
        Confirming a hypothesis requires at least one attached event, which is
        the invariant the whole product rests on; violating it returns 422 with
        `details.reason=evidence_required`. A closed investigation refuses
        further changes with 409, except reopening it: sending status=open
        clears the verdict and is written to the audit log.
      operationId: updateInvestigation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvestigationPatch' }
      responses:
        '200':
          description: The updated investigation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Investigation' }
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
        '409': { $ref: '../shared/responses.yaml#/components/responses/Conflict' }
        '422': { $ref: '../shared/responses.yaml#/components/responses/ValidationError' }

    delete:
      tags: [investigations]
      summary: Delete an investigation
      description: >-
        Removes the investigation and everything it owns — its events, entities,
        graph and edges — along with the whole subtree beneath it. Irreversible,
        and meant for cases opened by mistake; a case that was actually worked on
        should be closed with a verdict instead, so the reasoning survives.
      operationId: deleteInvestigation
      responses:
        '204':
          description: Deleted
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }

  /investigations/{investigation_id}/tree:
    parameters:
      - { $ref: '../shared/parameters.yaml#/components/parameters/InvestigationId' }
    get:
      tags: [investigations]
      summary: The whole subtree
      description: >-
        This investigation and everything under it, flattened in pre-order with
        a depth on each item. The client rebuilds the tree in one pass — no
        recursive fetching.
      operationId: getInvestigationTree
      responses:
        '200':
          description: The subtree
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvestigationTree' }
              example:
                root_id: 1a2b3c4d-0000-4000-8000-000000000001
                items:
                  - id: 1a2b3c4d-0000-4000-8000-000000000001
                    project_id: 9f3c1a7b2e
                    parent_id: null
                    title: Подозрительная активность на dc-01
                    status: open
                    severity: high
                    origin: analyst
                    version: 3
                    counters: { children: 2, events: 3, entities: 4, proposed_edges: 1 }
                    created_at: '2026-07-24T08:55:00Z'
                    updated_at: '2026-07-24T10:15:20Z'
                    depth: 0
                  - id: 1a2b3c4d-0000-4000-8000-000000000002
                    project_id: 9f3c1a7b2e
                    parent_id: 1a2b3c4d-0000-4000-8000-000000000001
                    title: 'Гипотеза: учётка svc-backup скомпрометирована'
                    status: open
                    severity: high
                    confidence: 0.6
                    origin: agent
                    origin_ref: run-4c81f0
                    version: 1
                    counters: { children: 0, events: 2, entities: 3, proposed_edges: 1 }
                    created_at: '2026-07-24T09:41:50Z'
                    updated_at: '2026-07-24T09:41:50Z'
                    depth: 1
                  - id: 1a2b3c4d-0000-4000-8000-000000000003
                    project_id: 9f3c1a7b2e
                    parent_id: 1a2b3c4d-0000-4000-8000-000000000001
                    title: 'Гипотеза: powershell запущен плановой задачей'
                    status: closed
                    severity: low
                    verdict: rejected
                    verdict_reason: >-
                      Расписание задачи не совпадает со временем запуска,
                      аргументы отличаются от эталонных.
                    confidence: 0.15
                    origin: analyst
                    version: 2
                    counters: { children: 0, events: 1, entities: 2, proposed_edges: 0 }
                    created_at: '2026-07-24T09:50:00Z'
                    updated_at: '2026-07-24T10:15:20Z'
                    closed_at: '2026-07-24T10:15:20Z'
                    depth: 1
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }

components:
  schemas:
    Investigation:
      type: object
      description: >-
        A case or a hypothesis within one — the same shape at every level of the
        tree. It owns its evidence, its entities and its graph; nothing crosses
        from one investigation to another.
      required: [id, project_id, title, status, version, created_at, updated_at, counters]
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the investigation.
        project_id:
          type: string
          description: >-
            Project that owns the case — the tenant. Every child inherits it
            unchanged, so a whole tree belongs to one tenant.
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            The investigation this one refines. Null means it is a root case;
            anything else means it is a hypothesis inside a larger case.
        title:
          type: string
          description: >-
            What is being investigated. For a hypothesis this is the claim being
            tested, phrased so a verdict makes sense against it.
        description:
          type: string
          nullable: true
          description: Free-form context — what is known, what is being checked and why.
        status:
          allOf: [{ $ref: '#/components/schemas/InvestigationStatus' }]
          description: >-
            Whether work is still going on. Independent of the verdict: a case
            can be open with no verdict yet, and closing requires one.
        # Не задано — это отсутствие поля, а не null. В OpenAPI 3.0 `nullable`
        # рядом с $ref на enum не работает (null не входит в список из ссылки),
        # а положить null прямо в enum нельзя: кодоген делает из него
        # константу-пустышку. Отсутствие — единственный вариант без артефактов.
        severity:
          allOf: [{ $ref: '../shared/enums.yaml#/components/schemas/Severity' }]
          description: >-
            How bad this looks. Set during triage and revised as evidence
            arrives. Absent until someone judges it.
        verdict:
          allOf: [{ $ref: '#/components/schemas/Verdict' }]
          description: >-
            The conclusion. Absent while the investigation is still open,
            required to close it. Which values are allowed depends on whether
            this is a root case or a hypothesis — see Verdict.
        verdict_reason:
          type: string
          nullable: true
          description: >-
            Why that conclusion. Required when rejecting — a rejected hypothesis
            without a reason teaches nobody anything.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
          description: >-
            How sure the conclusion is. Meaningful for a hypothesis, rarely used
            on a root case.
        origin:
          allOf: [{ $ref: '../shared/enums.yaml#/components/schemas/Origin' }]
          description: >-
            Who opened it — an analyst through the API, a linking rule, or an
            agent. Set by the server from how the request arrived; a client
            cannot claim it.
        origin_ref:
          type: string
          nullable: true
          description: >-
            Which one exactly — the analyst's subject id, the rule's code, or the
            agent run's identifier.
        version:
          type: integer
          description: >-
            Bumped on every change. Send the value you last read when updating;
            a mismatch means someone else edited it first.
        counters:
          type: object
          description: >-
            Size of the case at a glance, so the list does not need a query per
            row.
          required: [children, events, entities, proposed_edges]
          properties:
            children:
              type: integer
              description: Direct child investigations — the open hypotheses under this one.
            events:
              type: integer
              description: Events pulled into this investigation.
            entities:
              type: integer
              description: Distinct entities extracted from those events.
            proposed_edges:
              type: integer
              description: >-
                Edges still waiting for review. This is the analyst's queue —
                non-zero means there is work to do here.
        created_at:
          type: string
          format: date-time
          description: When the investigation was opened.
        updated_at:
          type: string
          format: date-time
          description: When it last changed.
        closed_at:
          type: string
          format: date-time
          nullable: true
          description: When it was closed. Cleared if the investigation is reopened.

    InvestigationCreate:
      type: object
      description: A new case, or a new hypothesis inside an existing one.
      required: [title]
      properties:
        title:
          type: string
          maxLength: 255
          description: What is being investigated, or the claim being tested.
        description:
          type: string
          description: Context — what is known so far and what needs checking.
        parent_id:
          type: string
          format: uuid
          description: >-
            The investigation this one refines. Omit it to open a root case.
        project_id:
          type: string
          description: >-
            Project that owns the case — the tenant. Required for a root,
            ignored for a child, which inherits its parent's.

            Temporary: the tenant belongs in the token, not in a request body.
            It is accepted for now so the frontend can work before auth is wired
            up, and goes away once it is.
        severity:
          allOf: [{ $ref: '../shared/enums.yaml#/components/schemas/Severity' }]
          description: Initial assessment. Can be revised later.

    InvestigationPatch:
      type: object
      description: >-
        Fields to change. Anything omitted stays as it is; `version` is always
        required so concurrent edits cannot overwrite each other silently.
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
          description: Version the client last read. A mismatch is a 409.
        title:
          type: string
          maxLength: 255
          description: New title.
        description:
          type: string
          description: New description.
        status:
          allOf: [{ $ref: '#/components/schemas/InvestigationStatus' }]
          description: >-
            Close the investigation, or reopen a closed one. Closing needs a
            verdict; reopening clears it.
        verdict:
          allOf: [{ $ref: '#/components/schemas/Verdict' }]
          description: >-
            The conclusion. Which values are allowed depends on whether this is
            a root case or a hypothesis.
        verdict_reason:
          type: string
          description: Why. Required when the verdict is rejected.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: How sure the conclusion is. Meaningful for a hypothesis.
        severity:
          allOf: [{ $ref: '../shared/enums.yaml#/components/schemas/Severity' }]
          description: Revised assessment of how bad this is.

    InvestigationStatus:
      type: string
      description: >-
        Whether work is still going on. Says nothing about the outcome — that is
        the verdict.
      enum: [open, closed]

    Verdict:
      type: string
      description: >-
        The conclusion, drawn from two vocabularies that share one field.
        A root case ends as incident, false_positive, not_affected or
        inconclusive. A hypothesis ends as confirmed, rejected or inconclusive.
        The server checks the value against the investigation's position in the
        tree, so a hypothesis cannot be closed as an incident.
      enum: [incident, false_positive, not_affected, inconclusive, confirmed, rejected]

    InvestigationPage:
      type: object
      description: One page of investigations.
      required: [items]
      properties:
        items:
          type: array
          description: The investigations on this page.
          items: { $ref: '#/components/schemas/Investigation' }
        next_cursor:
          type: string
          nullable: true
          description: >-
            Pass as `cursor` to get the next page. Absent on the last page.

    InvestigationTree:
      type: object
      description: A subtree flattened for one-pass rendering.
      required: [root_id, items]
      properties:
        root_id:
          type: string
          format: uuid
          description: The investigation the subtree was requested for.
        items:
          type: array
          description: >-
            Every investigation in the subtree in pre-order, starting with the
            root itself. Each carries its depth, so the client can indent
            without walking parent links.
          items:
            allOf:
              - { $ref: '#/components/schemas/Investigation' }
              - type: object
                required: [depth]
                properties:
                  depth:
                    type: integer
                    minimum: 0
                    description: Distance from the root. Zero for the root itself.
