openapi: 3.0.3
info:
  title: IR — entities
  version: 0.1.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []

paths:
  /investigations/{investigation_id}/entities:
    parameters:
      - { $ref: '../shared/parameters.yaml#/components/parameters/InvestigationId' }
    get:
      tags: [entities]
      summary: Entities of the investigation
      description: >-
        Everything the case has extracted so far, newest first. Backs the
        entity panel next to the graph and the picker used when drawing an edge
        by hand.
      operationId: listEntities
      parameters:
        - name: type_code
          in: query
          description: Keep only entities of this kind — host, user, ip, file_hash.
          schema: { type: string }
        - name: q
          in: query
          description: Substring match on the canonical key and the display name.
          schema: { type: string }
        - { $ref: '../shared/parameters.yaml#/components/parameters/Limit' }
        - { $ref: '../shared/parameters.yaml#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page of entities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntityPage' }
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '500': { $ref: '../shared/responses.yaml#/components/responses/InternalError' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
        '422': { $ref: '../shared/responses.yaml#/components/responses/ValidationError' }

  /entities:
    post:
      tags: [entities]
      summary: Add an entity by hand
      description: >-
        Entities normally arrive with events, but an analyst often starts from
        an indicator someone handed them — a hash from a bulletin, an address
        from a colleague — before any event mentions it. This creates that
        entity so it can be placed on the graph and reasoned about immediately.

        Idempotent on type and key: adding one that already exists returns the
        existing entity rather than a duplicate, so the same indicator entered
        twice stays one node.
      operationId: createEntity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntityCreate' }
      responses:
        '201':
          description: The entity, whether it was just created or already there
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entity' }
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '500': { $ref: '../shared/responses.yaml#/components/responses/InternalError' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
        '422': { $ref: '../shared/responses.yaml#/components/responses/ValidationError' }

  /entities/{entity_id}:
    parameters:
      - { $ref: '../shared/parameters.yaml#/components/parameters/EntityId' }
    patch:
      tags: [entities]
      summary: Edit an entity
      description: >-
        Changes only what a human can meaningfully improve — the label shown on
        the graph and the extra attributes. The type and the canonical key are
        fixed: they are the entity's identity, and rewriting them would silently
        turn one thing into another under every edge already attached to it.
      operationId: updateEntity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntityPatch' }
      responses:
        '200':
          description: The updated entity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entity' }
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '500': { $ref: '../shared/responses.yaml#/components/responses/InternalError' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
        '422': { $ref: '../shared/responses.yaml#/components/responses/ValidationError' }
    delete:
      tags: [entities]
      summary: Delete an entity from the tenant
      description: >-
        Erases the entity everywhere, along with its history. Almost never what
        is wanted — to remove it from one case delete the membership instead,
        which leaves the entity and the other cases alone.

        Refused while the entity is part of any investigation or mentioned by
        any event, so this only ever applies to something typed in by mistake.
      operationId: deleteEntity
      responses:
        '204':
          description: Deleted
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '500': { $ref: '../shared/responses.yaml#/components/responses/InternalError' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
        '409': { $ref: '../shared/responses.yaml#/components/responses/Conflict' }
    get:
      tags: [entities]
      summary: Entity card
      description: >-
        Everything known about one host, account, process, address or hash
        across the whole tenant: how much evidence mentions it, which
        investigations it turns up in, and what it is connected to. The
        cross-case part is what answers "have we seen this before", and it works
        precisely because the entity is one row rather than a copy per case.
      operationId: getEntityCard
      responses:
        '200':
          description: The card
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntityCard' }
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '500': { $ref: '../shared/responses.yaml#/components/responses/InternalError' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }

  /entities/{entity_id}/investigations/{investigation_id}:
    parameters:
      - { $ref: '../shared/parameters.yaml#/components/parameters/EntityId' }
      - { $ref: '../shared/parameters.yaml#/components/parameters/InvestigationId' }
    delete:
      tags: [entities]
      summary: Drop an entity from the investigation
      description: >-
        Says "this does not belong to my case", not "this never existed". The
        entity survives with its history intact and stays in every other case it
        is part of; only the membership goes, taking this case's graph node and
        the edges hanging off it.

        Refused while an event of this case still mentions the entity — the
        entity is a consequence of that evidence, so drop the event instead.
      operationId: detachEntity
      responses:
        '204':
          description: Dropped from the investigation
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '500': { $ref: '../shared/responses.yaml#/components/responses/InternalError' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
        '409': { $ref: '../shared/responses.yaml#/components/responses/Conflict' }

components:
  schemas:
    Entity:
      type: object
      description: >-
        A named thing an incident revolves around — a host, account, process,
        address or hash — extracted from source events during ingestion.

        An entity belongs to the tenant, not to one investigation: one host is
        one row no matter how many cases touch it. That is what makes
        first_seen, last_seen and the cross-case history on the card mean
        anything. Across tenants nothing is merged — dc-01 of two different
        customers stays two hosts.
      required: [id, type_code, canonical_key]
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the entity within the tenant.
        added_via:
          allOf: [{ $ref: '#/components/schemas/EntityOrigin' }]
          description: >-
            How it got into the investigation being listed. A property of the
            membership, not of the entity — extracted from an event in one case,
            typed in as an indicator in another.
        type_code:
          type: string
          description: >-
            Kind of thing this is — host, user, account, email, process, ip,
            domain, url, file_hash. The core set is fixed; peripheral kinds are
            added as dictionary rows without a migration.
        canonical_key:
          type: string
          description: >-
            Normalised identity used for matching: fqdn for a host, SID for an
            account, GUID for a process, sha256 for a file. Two records with the
            same type and key are the same thing, so linking rules join on it.
        display_name:
          type: string
          nullable: true
          description: Label for the UI. Falls back to canonical_key when absent.
        metadata:
          type: object
          description: >-
            Extra attributes carried over from the source — OS version, owner,
            geolocation. Free-form on purpose: sources differ.
          additionalProperties: true
        first_seen:
          type: string
          format: date-time
          nullable: true
          description: >-
            Earliest event mentioning the entity anywhere in the tenant, not
            just in the case at hand.
        last_seen:
          type: string
          format: date-time
          nullable: true
          description: >-
            Latest event mentioning it. Together with first_seen this bounds the
            window the entity was active in, across every investigation.

    EntityOrigin:
      type: string
      description: How an entity came to be part of an investigation.
      enum: [event, ioc, agent, analyst]

    EntityCreate:
      type: object
      description: An entity entered by hand, before any event mentions it.
      required: [investigation_id, type_code, canonical_key]
      properties:
        investigation_id:
          type: string
          format: uuid
          description: >-
            Investigation to add the entity to. The entity itself belongs to the
            tenant, so this says where it should show up, not who owns it.
        type_code:
          type: string
          description: >-
            Kind of thing, from the entity-type dictionary. Rejected if unknown,
            so a typo cannot invent a type.
        canonical_key:
          type: string
          description: >-
            Normalised identity — fqdn for a host, SID for an account, sha256
            for a file. Together with the type this is what makes two records
            the same thing, so it is worth normalising before sending.
        display_name:
          type: string
          description: Label for the UI. Falls back to the canonical key when absent.
        metadata:
          type: object
          description: Anything else worth carrying — where the indicator came from, notes.
          additionalProperties: true

    EntityPatch:
      type: object
      description: >-
        Fields to change. Anything omitted stays as it is. Identity — the type
        and the canonical key — is not editable.
      properties:
        display_name:
          type: string
          description: New label for the UI.
        metadata:
          type: object
          description: Replaces the stored attributes wholesale, not merged into them.
          additionalProperties: true

    EntityPage:
      type: object
      description: One page of entities.
      required: [items]
      properties:
        items:
          type: array
          description: The entities on this page.
          items: { $ref: '#/components/schemas/Entity' }
        next_cursor:
          type: string
          nullable: true
          description: Pass as `cursor` to get the next page. Absent on the last page.

    EntityCard:
      type: object
      description: >-
        Entity plus the context an analyst needs to judge it: how much of this
        case it touches, where else it has surfaced, and who it talks to.
      required: [entity, events_count, occurrences]
      properties:
        entity:
          allOf: [{ $ref: '#/components/schemas/Entity' }]
          description: The entity this card is about.
        events_count:
          type: integer
          description: >-
            Events across the tenant the entity takes part in. Per-case counts
            are in `occurrences`.
        occurrences:
          type: array
          description: >-
            Investigations the entity is part of, with its weight in each. This
            is the spread assessment: a hash in five cases means five hosts to
            check. Since the entity is one row rather than a copy per case, this
            is a plain lookup, not a match on type and key.
          items:
            type: object
            required: [investigation_id, title, events_count]
            properties:
              investigation_id:
                type: string
                format: uuid
                description: The investigation.
              title:
                type: string
                description: Its title, so the analyst can judge relevance without opening it.
              events_count:
                type: integer
                description: How many of its events involve the entity.
        neighbors:
          type: array
          description: >-
            Entities reachable over confirmed edges only. Proposed links are
            left out — a card should show what is established, not what is
            suspected.
          items:
            type: object
            required: [entity_id, relation_code]
            properties:
              entity_id:
                type: string
                format: uuid
                description: The neighbouring entity.
              display_name:
                type: string
                nullable: true
                description: Its label for the UI.
              relation_code:
                type: string
                description: >-
                  How they are related — parent_process, logged_in,
                  connected_to, executed, resolved_to, same_host.
