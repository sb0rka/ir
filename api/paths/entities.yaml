openapi: 3.0.3
info:
  title: IR — entities
  version: 0.1.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []

paths:
  /investigations/{investigation_id}/entities:
    parameters:
      - { $ref: '../shared/parameters.yaml#/components/parameters/InvestigationId' }
    get:
      tags: [entities]
      summary: Entities of the investigation
      description: >-
        Everything the case has extracted so far, newest first. Backs the
        entity panel next to the graph and the picker used when drawing an edge
        by hand.
      operationId: listEntities
      parameters:
        - name: type_code
          in: query
          description: Keep only entities of this kind — host, user, ip, file_hash.
          schema: { type: string }
        - name: q
          in: query
          description: Substring match on the canonical key and the display name.
          schema: { type: string }
        - { $ref: '../shared/parameters.yaml#/components/parameters/Limit' }
        - { $ref: '../shared/parameters.yaml#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page of entities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntityPage' }
              example:
                items:
                  - id: 22222222-0000-4000-8000-000000000001
                    investigation_id: 1a2b3c4d-0000-4000-8000-000000000001
                    type_code: host
                    canonical_key: dc-01.corp.local
                    display_name: dc-01.corp.local
                    metadata: { os: Windows Server 2022, role: domain_controller }
                    first_seen: '2026-07-24T03:12:47Z'
                    last_seen: '2026-07-24T03:15:02Z'
                  - id: 22222222-0000-4000-8000-000000000002
                    investigation_id: 1a2b3c4d-0000-4000-8000-000000000001
                    type_code: account
                    canonical_key: S-1-5-21-1004336348-1177238915-682003330-1123
                    display_name: CORP\svc-backup
                    metadata: { enabled: true, last_password_set: '2023-02-11T00:00:00Z' }
                    first_seen: '2026-07-24T03:12:47Z'
                    last_seen: '2026-07-24T03:14:22Z'
                  - id: 22222222-0000-4000-8000-000000000003
                    investigation_id: 1a2b3c4d-0000-4000-8000-000000000001
                    type_code: process
                    canonical_key: '{6f1c2a90-4d3e-4b7a-9c11-8e2f5a7b0d44}'
                    display_name: powershell.exe
                    metadata: { pid: 7412, integrity: high }
                    first_seen: '2026-07-24T03:14:22Z'
                    last_seen: '2026-07-24T03:15:02Z'
                  - id: 22222222-0000-4000-8000-000000000004
                    investigation_id: 1a2b3c4d-0000-4000-8000-000000000001
                    type_code: ip
                    canonical_key: 185.220.101.47
                    display_name: 185.220.101.47
                    metadata: { asn: 205100, country: NL }
                    first_seen: '2026-07-24T03:15:02Z'
                    last_seen: '2026-07-24T03:15:02Z'
                next_cursor: null
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
        '422': { $ref: '../shared/responses.yaml#/components/responses/ValidationError' }
    post:
      tags: [entities]
      summary: Add an entity by hand
      description: >-
        Entities normally arrive with events, but an analyst often starts from
        an indicator someone handed them — a hash from a bulletin, an address
        from a colleague — before any event mentions it. This creates that
        entity so it can be placed on the graph and reasoned about immediately.

        Idempotent on type and key: adding one that already exists returns the
        existing entity rather than a duplicate, so the same indicator entered
        twice stays one node.
      operationId: createEntity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntityCreate' }
      responses:
        '201':
          description: The entity, whether it was just created or already there
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entity' }
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
        '422': { $ref: '../shared/responses.yaml#/components/responses/ValidationError' }

  /entities/{entity_id}:
    parameters:
      - { $ref: '../shared/parameters.yaml#/components/parameters/EntityId' }
    patch:
      tags: [entities]
      summary: Edit an entity
      description: >-
        Changes only what a human can meaningfully improve — the label shown on
        the graph and the extra attributes. The type and the canonical key are
        fixed: they are the entity's identity, and rewriting them would silently
        turn one thing into another under every edge already attached to it.
      operationId: updateEntity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntityPatch' }
      responses:
        '200':
          description: The updated entity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entity' }
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
        '422': { $ref: '../shared/responses.yaml#/components/responses/ValidationError' }
    delete:
      tags: [entities]
      summary: Delete an entity
      description: >-
        Removes the entity together with its graph node and the edges attached
        to it. Refused while any event still mentions it — an entity extracted
        from evidence is a consequence of that evidence, so drop the event
        instead.
      operationId: deleteEntity
      responses:
        '204':
          description: Deleted
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
        '409': { $ref: '../shared/responses.yaml#/components/responses/Conflict' }
    get:
      tags: [entities]
      summary: Entity card
      description: >-
        Everything known about one host, account, process, address or hash: how
        often it shows up in this investigation, which other investigations of
        the tenant it appears in, and what it is connected to. The cross-case
        part is what answers "have we seen this before".
      operationId: getEntityCard
      responses:
        '200':
          description: The card
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntityCard' }
              example:
                entity:
                  id: 22222222-0000-4000-8000-000000000001
                  investigation_id: 1a2b3c4d-0000-4000-8000-000000000001
                  type_code: host
                  canonical_key: dc-01.corp.local
                  display_name: dc-01.corp.local
                  metadata: { os: Windows Server 2022, role: domain_controller }
                  first_seen: '2026-07-24T03:12:47Z'
                  last_seen: '2026-07-24T03:15:02Z'
                events_count: 3
                occurrences:
                  - investigation_id: 1a2b3c4d-0000-4000-8000-000000000004
                    title: Фишинговая рассылка в бухгалтерию
                    events_count: 2
                  - investigation_id: 1a2b3c4d-0000-4000-8000-000000000005
                    title: Аномальный трафик из сегмента DMZ
                    events_count: 9
                neighbors:
                  - entity_id: 22222222-0000-4000-8000-000000000002
                    display_name: CORP\svc-backup
                    relation_code: logged_in
                  - entity_id: 22222222-0000-4000-8000-000000000003
                    display_name: powershell.exe
                    relation_code: executed
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }

components:
  schemas:
    Entity:
      type: object
      description: >-
        A named thing an incident revolves around, extracted from source events
        during ingestion. Entities are scoped to one investigation; the same
        real-world host appears as a separate row in each case it touches.
      required: [id, investigation_id, type_code, canonical_key]
      properties:
        id:
          type: string
          format: uuid
          description: Server-assigned identifier of this entity.
        investigation_id:
          type: string
          format: uuid
          description: Investigation this entity belongs to.
        type_code:
          type: string
          description: >-
            Kind of thing this is — host, user, account, email, process, ip,
            domain, url, file_hash. The core set is fixed; peripheral kinds are
            added as dictionary rows without a migration.
        canonical_key:
          type: string
          description: >-
            Normalised identity used for matching: fqdn for a host, SID for an
            account, GUID for a process, sha256 for a file. Two records with the
            same type and key are the same thing, so linking rules join on it.
        display_name:
          type: string
          nullable: true
          description: Label for the UI. Falls back to canonical_key when absent.
        metadata:
          type: object
          description: >-
            Extra attributes carried over from the source — OS version, owner,
            geolocation. Free-form on purpose: sources differ.
          additionalProperties: true
        first_seen:
          type: string
          format: date-time
          nullable: true
          description: Earliest event in this investigation that mentions the entity.
        last_seen:
          type: string
          format: date-time
          nullable: true
          description: >-
            Latest event that mentions it. Together with first_seen this bounds
            the window the entity was active in.

    EntityCreate:
      type: object
      description: An entity entered by hand, before any event mentions it.
      required: [type_code, canonical_key]
      properties:
        type_code:
          type: string
          description: >-
            Kind of thing, from the entity-type dictionary. Rejected if unknown,
            so a typo cannot invent a type.
        canonical_key:
          type: string
          description: >-
            Normalised identity — fqdn for a host, SID for an account, sha256
            for a file. Together with the type this is what makes two records
            the same thing, so it is worth normalising before sending.
        display_name:
          type: string
          description: Label for the UI. Falls back to the canonical key when absent.
        metadata:
          type: object
          description: Anything else worth carrying — where the indicator came from, notes.
          additionalProperties: true

    EntityPatch:
      type: object
      description: >-
        Fields to change. Anything omitted stays as it is. Identity — the type
        and the canonical key — is not editable.
      properties:
        display_name:
          type: string
          description: New label for the UI.
        metadata:
          type: object
          description: Replaces the stored attributes wholesale, not merged into them.
          additionalProperties: true

    EntityPage:
      type: object
      description: One page of entities.
      required: [items]
      properties:
        items:
          type: array
          description: The entities on this page.
          items: { $ref: '#/components/schemas/Entity' }
        next_cursor:
          type: string
          nullable: true
          description: Pass as `cursor` to get the next page. Absent on the last page.

    EntityCard:
      type: object
      description: >-
        Entity plus the context an analyst needs to judge it: how much of this
        case it touches, where else it has surfaced, and who it talks to.
      required: [entity, events_count, occurrences]
      properties:
        entity:
          allOf: [{ $ref: '#/components/schemas/Entity' }]
          description: The entity this card is about.
        events_count:
          type: integer
          description: >-
            Events in this investigation the entity takes part in. A rough
            measure of how central it is to the case.
        occurrences:
          type: array
          description: >-
            Other investigations of the same tenant where an entity with the
            same type and key shows up. This is the spread assessment: a hash
            seen in five cases means five hosts to check.
          items:
            type: object
            required: [investigation_id, title, events_count]
            properties:
              investigation_id:
                type: string
                format: uuid
                description: The other investigation.
              title:
                type: string
                description: Its title, so the analyst can judge relevance without opening it.
              events_count:
                type: integer
                description: How many of its events involve the entity.
        neighbors:
          type: array
          description: >-
            Entities reachable over confirmed edges only. Proposed links are
            left out — a card should show what is established, not what is
            suspected.
          items:
            type: object
            required: [entity_id, relation_code]
            properties:
              entity_id:
                type: string
                format: uuid
                description: The neighbouring entity.
              display_name:
                type: string
                nullable: true
                description: Its label for the UI.
              relation_code:
                type: string
                description: >-
                  How they are related — parent_process, logged_in,
                  connected_to, executed, resolved_to, same_host.
