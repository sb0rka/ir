openapi: 3.0.3
info:
  title: IR — артефакты
  version: 0.1.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []

paths:
  /investigations/{investigation_id}/artifacts:
    parameters:
      - { $ref: '../shared/parameters.yaml#/InvestigationId' }
    post:
      tags: [artifacts]
      summary: Добавить артефакт
      operationId: createArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtifactCreate' }
      responses:
        '201':
          description: Артефакт
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }
        '401': { $ref: '../shared/responses.yaml#/Unauthorized' }
        '403': { $ref: '../shared/responses.yaml#/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/NotFound' }
        '409': { $ref: '../shared/responses.yaml#/Conflict' }
        '422': { $ref: '../shared/responses.yaml#/ValidationError' }
    get:
      tags: [artifacts]
      summary: Артефакты расследования
      operationId: listArtifacts
      parameters:
        - { name: type_code, in: query, schema: { type: string } }
        - { $ref: '../shared/parameters.yaml#/Limit' }
        - { $ref: '../shared/parameters.yaml#/Cursor' }
      responses:
        '200':
          description: Страница артефактов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactPage' }
        '401': { $ref: '../shared/responses.yaml#/Unauthorized' }
        '403': { $ref: '../shared/responses.yaml#/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/NotFound' }
        '422': { $ref: '../shared/responses.yaml#/ValidationError' }

  /artifacts/{artifact_id}:
    parameters:
      - { $ref: '../shared/parameters.yaml#/ArtifactId' }
    get:
      tags: [artifacts]
      summary: Артефакт с вердиктами обогащений
      operationId: getArtifact
      responses:
        '200':
          description: Артефакт
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }
        '401': { $ref: '../shared/responses.yaml#/Unauthorized' }
        '403': { $ref: '../shared/responses.yaml#/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/NotFound' }

  /artifacts/{artifact_id}/enrich:
    parameters:
      - { $ref: '../shared/parameters.yaml#/ArtifactId' }
    post:
      tags: [artifacts]
      summary: Обогатить артефакт расширением
      description: |
        Репутация, декодирование, песочница. Расширение берётся из allowlist;
        каждый внешний вызов помечается в аудите как передача данных наружу.
        Недоступность расширения не ошибка запроса — вернётся вердикт status=error.
      operationId: enrichArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrichRequest' }
      responses:
        '200':
          description: Вердикт
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrichmentVerdict' }
        '401': { $ref: '../shared/responses.yaml#/Unauthorized' }
        '403':
          description: Расширение не в allowlist или роль не даёт действия (code=forbidden)
          content:
            application/json:
              schema: { $ref: '../shared/errors.yaml#/ErrorResponse' }
        '404': { $ref: '../shared/responses.yaml#/NotFound' }
        '422': { $ref: '../shared/responses.yaml#/ValidationError' }

  /investigations/{investigation_id}/iocs:
    parameters:
      - { $ref: '../shared/parameters.yaml#/InvestigationId' }
    post:
      tags: [artifacts]
      summary: Массовый ввод индикаторов
      description: |
        Создаёт артефакты и сущности из списка индикаторов. С retro_search=true
        ищет их по источникам и затягивает найденное — оценка распространения
        по узлам инфраструктуры. Большая выборка уходит в фон (job_id).
      operationId: importIocs
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IocImportRequest' }
      responses:
        '200':
          description: Итог импорта
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IocImportResult' }
        '401': { $ref: '../shared/responses.yaml#/Unauthorized' }
        '403': { $ref: '../shared/responses.yaml#/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/NotFound' }
        '409': { $ref: '../shared/responses.yaml#/Conflict' }
        '422': { $ref: '../shared/responses.yaml#/ValidationError' }
        '502': { $ref: '../shared/responses.yaml#/SourceUnavailable' }

components:
  schemas:
    Artifact:
      type: object
      description: |
        Индикатор компрометации в скоупе расследования: хеш, адрес, домен, файл.
        Накапливает вердикты обогащений от внешних расширений.
      required: [id, investigation_id, type_code, value, created_at]
      properties:
        id: { type: string, format: uuid }
        investigation_id: { type: string, format: uuid }
        type_code: { type: string, description: Тип из справочника EntityType }
        value: { type: string }
        entity_id: { type: string, format: uuid, nullable: true, description: Связанная сущность графа }
        storage_ref: { type: string, nullable: true, description: Файл в object storage }
        media_type: { type: string, nullable: true }
        checksum: { type: string, nullable: true }
        is_bundle: { type: boolean }
        enrichment_verdicts:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/EnrichmentVerdict'
          description: Ключ — код расширения
        metadata:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }
    ArtifactCreate:
      type: object
      required: [type_code, value]
      properties:
        type_code: { type: string }
        value: { type: string }
        entity_id: { type: string, format: uuid }
        metadata:
          type: object
          additionalProperties: true
    ArtifactPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Artifact' }
        next_cursor: { type: string, nullable: true }
    EnrichRequest:
      type: object
      required: [extension_code]
      properties:
        extension_code:
          type: string
          description: Код расширения из allowlist. Недоступность не валит запрос — вернётся status=error
    EnrichmentVerdict:
      type: object
      required: [extension_code, status, enriched_at]
      properties:
        extension_code: { type: string }
        status:
          type: string
          enum: [clean, suspicious, malicious, unknown, error]
        score: { type: number, nullable: true }
        detail:
          type: object
          additionalProperties: true
        external_call:
          type: boolean
          description: Данные уходили наружу — отражено в аудите (п.6.4 ТЗ)
        cached: { type: boolean }
        enriched_at: { type: string, format: date-time }
    IocImportRequest:
      type: object
      description: |
        Массовый ввод индикаторов. Создаёт артефакты и сущности, запускает
        ретро-поиск по источникам — закрывает задачу оценки распространения.
      required: [items]
      properties:
        items:
          type: array
          maxItems: 500
          items:
            type: object
            required: [type_code, value]
            properties:
              type_code: { type: string }
              value: { type: string }
        retro_search:
          type: boolean
          default: false
          description: Искать индикаторы по источникам и затягивать найденное в расследование
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
    IocImportResult:
      type: object
      required: [created, duplicates]
      properties:
        created: { type: integer }
        duplicates: { type: integer }
        retro_events_attached: { type: integer, description: Затянуто событий ретро-поиском }
        job_id:
          type: string
          format: uuid
          nullable: true
          description: Если ретро-поиск ушёл в фон
