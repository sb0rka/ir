openapi: 3.0.3
info:
  title: IR — graph
  version: 0.1.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []

paths:
  /investigations/{investigation_id}/graph:
    parameters:
      - { $ref: '../shared/parameters.yaml#/components/parameters/InvestigationId' }
    get:
      tags: [graph]
      summary: Graph of the investigation
      description: >-
        Nodes and edges of one case — the main working surface for both the
        analyst and the agent. Rejected edges are hidden by default: they stay
        in the data as "checked and excluded" but do not clutter the picture.
      operationId: getGraph
      parameters:
        - name: include_subtree
          in: query
          description: >-
            Also return the graphs of child investigations. Nodes stay
            per-case, so the same host appears once per investigation — group
            them client-side by type_code and canonical_key.
          schema: { type: boolean, default: false }
        - name: min_confidence
          in: query
          description: >-
            Drop edges the producer was less sure about than this. Useful for
            thinning out an agent's suggestions.
          schema: { type: number, minimum: 0, maximum: 1 }
        - name: statuses
          in: query
          description: >-
            Which edge states to include. Defaults to proposed and confirmed;
            pass rejected explicitly to see what was ruled out.
          schema:
            type: array
            items: { $ref: '../shared/enums.yaml#/components/schemas/EdgeStatus' }
          style: form
          explode: false
      responses:
        '200':
          description: The graph
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Graph' }
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
        '422': { $ref: '../shared/responses.yaml#/components/responses/ValidationError' }

  /investigations/{investigation_id}/nodes:
    parameters:
      - { $ref: '../shared/parameters.yaml#/components/parameters/InvestigationId' }
    get:
      tags: [graph]
      summary: Nodes of the investigation
      description: >-
        The nodes alone, paginated — for lists and pickers, where the full graph
        payload with all its edges would be wasteful.
      operationId: listNodes
      parameters:
        - name: node_type
          in: query
          description: Keep only entity nodes or only event nodes.
          schema: { $ref: '../shared/enums.yaml#/components/schemas/NodeType' }
        - name: q
          in: query
          description: Substring match on the node label.
          schema: { type: string }
        - { $ref: '../shared/parameters.yaml#/components/parameters/Limit' }
        - { $ref: '../shared/parameters.yaml#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page of nodes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodePage' }
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
        '422': { $ref: '../shared/responses.yaml#/components/responses/ValidationError' }
    post:
      tags: [graph]
      summary: Put a node on the graph
      description: >-
        Entity nodes appear on their own when events are pulled in, but events
        stay on the timeline until someone decides one matters. This is that
        decision — the analyst promotes an event from the timeline onto the
        graph so edges can be drawn from it, which is how an attack chain gets
        reconstructed by hand.

        Idempotent: promoting something already on the graph returns the
        existing node rather than failing, so the button is safe to press twice.
      operationId: createNode
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeCreate' }
      responses:
        '201':
          description: The node, whether it was just created or already there
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GraphNode' }
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
        '422': { $ref: '../shared/responses.yaml#/components/responses/ValidationError' }

  /nodes/{node_id}:
    parameters:
      - { $ref: '../shared/parameters.yaml#/components/parameters/NodeId' }
    get:
      tags: [graph]
      summary: One node
      description: The node on its own, for a detail panel or a hover card.
      operationId: getNode
      responses:
        '200':
          description: The node
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GraphNode' }
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
    delete:
      tags: [graph]
      summary: Take a node off the graph
      description: >-
        Removes the node and every edge touching it. The entity or event behind
        it stays — this only says "not worth showing on the graph", which is how
        a mistakenly promoted event gets undone.
      operationId: deleteNode
      responses:
        '204':
          description: Removed
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }

  /investigations/{investigation_id}/edges:
    parameters:
      - { $ref: '../shared/parameters.yaml#/components/parameters/InvestigationId' }
    get:
      tags: [graph]
      summary: Edges of the investigation
      description: >-
        The edges alone, paginated. This is what backs the review queue —
        filter to proposed, sort through them, then confirm or reject in bulk.
      operationId: listEdges
      parameters:
        - name: statuses
          in: query
          description: Which edge states to include. Defaults to proposed and confirmed.
          schema:
            type: array
            items: { $ref: '../shared/enums.yaml#/components/schemas/EdgeStatus' }
          style: form
          explode: false
        - name: origin
          in: query
          description: >-
            Keep only edges from one producer. Filtering to agent is how a
            reviewer looks at just the machine's suggestions.
          schema: { $ref: '../shared/enums.yaml#/components/schemas/Origin' }
        - name: relation_code
          in: query
          description: Keep only edges asserting this relation.
          schema: { type: string }
        - name: node_id
          in: query
          description: Keep only edges touching this node, in either direction.
          schema: { type: string, format: uuid }
        - name: min_confidence
          in: query
          description: Drop edges the producer was less sure about than this.
          schema: { type: number, minimum: 0, maximum: 1 }
        - { $ref: '../shared/parameters.yaml#/components/parameters/Limit' }
        - { $ref: '../shared/parameters.yaml#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page of edges
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgePage' }
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
        '422': { $ref: '../shared/responses.yaml#/components/responses/ValidationError' }
    post:
      tags: [graph]
      summary: Draw an edge by hand
      description: >-
        The analyst's manual correction of the graph. An edge created here is
        born confirmed — a human asserting it is the assertion. The relation
        must exist in the dictionary and its declared endpoints must match the
        node kinds, so an event-to-event relation cannot be hung between two
        entities. Re-creating the same triple returns 409 rather than a
        duplicate.
      operationId: createEdge
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdgeCreate' }
      responses:
        '201':
          description: The new edge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Edge' }
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
        '409': { $ref: '../shared/responses.yaml#/components/responses/Conflict' }
        '422': { $ref: '../shared/responses.yaml#/components/responses/ValidationError' }

  /edges/{edge_id}:
    parameters:
      - { $ref: '../shared/parameters.yaml#/components/parameters/EdgeId' }
    get:
      tags: [graph]
      summary: One edge
      description: The edge with its evidence ids, for a detail panel.
      operationId: getEdge
      responses:
        '200':
          description: The edge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Edge' }
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
    patch:
      tags: [graph]
      summary: Edit one edge
      description: >-
        Reviewing a single edge, plus corrections to what it claims. Rejecting
        requires a reason. The endpoints and the relation are fixed — an edge
        between different nodes is a different claim, so delete this one and
        draw the right one.

        Use the batch review endpoint when handling a queue; this is for the one
        edge open in front of you.
      operationId: updateEdge
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdgePatch' }
      responses:
        '200':
          description: The updated edge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Edge' }
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
        '409': { $ref: '../shared/responses.yaml#/components/responses/Conflict' }
        '422': { $ref: '../shared/responses.yaml#/components/responses/ValidationError' }
    delete:
      tags: [graph]
      summary: Delete an edge
      description: >-
        For an edge drawn by mistake. A claim that was considered and found
        wrong should be rejected with a reason instead — that survives into the
        report as "checked and excluded", while deleting leaves no trace that
        anyone looked.
      operationId: deleteEdge
      responses:
        '204':
          description: Deleted
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }

  /edges/{edge_id}/evidence:
    parameters:
      - { $ref: '../shared/parameters.yaml#/components/parameters/EdgeId' }
    get:
      tags: [graph]
      summary: What the edge rests on
      description: >-
        The cited events in full. This is the provenance chain the product is
        built to defend: from a claim on the graph to the events behind it, and
        from each event to the record in the source tool.
      operationId: listEdgeEvidence
      responses:
        '200':
          description: The cited events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeEvidence' }
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
    post:
      tags: [graph]
      summary: Cite more events
      description: >-
        Adds grounds to an edge that already exists — the case for a claim
        usually accumulates rather than arriving complete. Events must belong to
        the same investigation; citing another case's evidence is refused by the
        database, not merely by the service. Already-cited events are ignored
        rather than duplicated.
      operationId: addEdgeEvidence
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdgeEvidenceAdd' }
      responses:
        '200':
          description: The evidence after the addition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeEvidence' }
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
        '422': { $ref: '../shared/responses.yaml#/components/responses/ValidationError' }

  /edges/{edge_id}/evidence/{event_id}:
    parameters:
      - { $ref: '../shared/parameters.yaml#/components/parameters/EdgeId' }
      - { $ref: '../shared/parameters.yaml#/components/parameters/EventId' }
    delete:
      tags: [graph]
      summary: Stop citing an event
      description: >-
        Removes one ground from an edge. Refused if it is the last one on a
        confirmed edge: an established claim resting on nothing is exactly what
        the product exists to prevent. Reject the edge instead.
      operationId: deleteEdgeEvidence
      responses:
        '204':
          description: Removed
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
        '422': { $ref: '../shared/responses.yaml#/components/responses/ValidationError' }

  /investigations/{investigation_id}/review:
    parameters:
      - { $ref: '../shared/parameters.yaml#/components/parameters/InvestigationId' }
    post:
      tags: [graph]
      summary: Review proposed edges in bulk
      description: >-
        Where a human accepts or rules out what rules and agents suggested.
        All or nothing: if any item carries a stale version the whole batch is
        refused with 409 and `details.conflicts` naming the ids, and nothing is
        written — so an optimistic UI can roll back precisely.
      operationId: reviewEdges
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewRequest' }
      responses:
        '200':
          description: What the batch changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewResult' }
        '401': { $ref: '../shared/responses.yaml#/components/responses/Unauthorized' }
        '501': { $ref: '../shared/responses.yaml#/components/responses/NotImplemented' }
        '403': { $ref: '../shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/responses.yaml#/components/responses/NotFound' }
        '409': { $ref: '../shared/responses.yaml#/components/responses/Conflict' }
        '422': { $ref: '../shared/responses.yaml#/components/responses/ValidationError' }

components:
  schemas:
    Graph:
      type: object
      description: Nodes and edges as one payload, ready to render.
      required: [investigation_id, nodes, edges]
      properties:
        investigation_id:
          type: string
          format: uuid
          description: Investigation this graph belongs to.
        include_subtree:
          type: boolean
          description: Whether child investigations were merged into this response.
        nodes:
          type: array
          description: Every node referenced by the edges below, plus isolated ones.
          items: { $ref: '#/components/schemas/GraphNode' }
        edges:
          type: array
          description: Edges surviving the status and confidence filters.
          items: { $ref: '#/components/schemas/Edge' }

    GraphNode:
      type: object
      description: >-
        A point on the graph. Stands for exactly one entity or one event —
        never both, never neither.
      required: [id, investigation_id, node_type, origin]
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the node. Edges reference this, not the entity or event.
        investigation_id:
          type: string
          format: uuid
          description: Investigation the node belongs to.
        node_type:
          allOf: [{ $ref: '../shared/enums.yaml#/components/schemas/NodeType' }]
          description: Which of the two fields below is filled.
        entity_id:
          type: string
          format: uuid
          nullable: true
          description: The entity, when node_type is entity.
        event_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            The event, when node_type is event. Only events promoted onto the
            graph get a node — the rest live on the timeline.
        origin:
          allOf: [{ $ref: '../shared/enums.yaml#/components/schemas/Origin' }]
          description: Who put this node on the graph.
        label:
          type: string
          description: >-
            Text to draw on the node — the entity's display name or a short
            summary of the event.
        type_code:
          type: string
          nullable: true
          description: >-
            Kind of entity, which is what picks the icon. Entity nodes only.
        canonical_key:
          type: string
          nullable: true
          description: >-
            Entity's normalised identity. Lets the client fold duplicates of the
            same host across a merged subtree.
        occurred_at:
          type: string
          format: date-time
          nullable: true
          description: When the event happened. Event nodes only.

    NodeCreate:
      type: object
      description: >-
        What to promote onto the graph. Give exactly one of the two ids, and it
        must match node_type — the pair is what says which one is meant.
      required: [node_type]
      properties:
        node_type:
          allOf: [{ $ref: '../shared/enums.yaml#/components/schemas/NodeType' }]
          description: Which of the two ids below is being given.
        entity_id:
          type: string
          format: uuid
          description: >-
            The entity, when node_type is entity. Rarely needed — entities are
            put on the graph automatically as their events arrive.
        event_id:
          type: string
          format: uuid
          description: >-
            The event, when node_type is event. Must already belong to this
            investigation.

    Edge:
      type: object
      description: >-
        A claim that two nodes are related. Unlike an event, an edge can be
        wrong — hence a status, a stated reason, and the events it rests on.
      required: [id, investigation_id, source_node_id, target_node_id, relation_code, status, origin, version, evidence_count]
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the edge.
        investigation_id:
          type: string
          format: uuid
          description: Investigation the edge belongs to.
        source_node_id:
          type: string
          format: uuid
          description: Node the relation starts from.
        target_node_id:
          type: string
          format: uuid
          description: >-
            Node it points to. For an undirected relation the order carries no
            meaning.
        relation_code:
          type: string
          description: >-
            What the relation is — parent_process, logged_in, connected_to,
            executed, resolved_to, same_host, subevent_of, followed_by.
        status:
          allOf: [{ $ref: '../shared/enums.yaml#/components/schemas/EdgeStatus' }]
          description: Where the claim stands in review.
        reject_reason:
          type: string
          nullable: true
          description: >-
            Why it was ruled out. Required when rejecting, and it is what makes
            a rejected branch useful in the report.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
          description: >-
            How sure the producer was. Rules carry a fixed value per rule;
            an agent estimates its own.
        why:
          type: string
          nullable: true
          description: >-
            Plain-language justification. Mandatory for an agent: an unexplained
            machine suggestion is not reviewable.
        origin:
          allOf: [{ $ref: '../shared/enums.yaml#/components/schemas/Origin' }]
          description: Who produced the claim. Never changes, unlike status.
        origin_ref:
          type: string
          nullable: true
          description: >-
            Which one exactly — the analyst's subject id, the rule's code, or
            the agent run's identifier. Together with origin this is how a claim
            is traced back to its author.
        evidence_count:
          type: integer
          description: >-
            How many events the edge cites. Zero is allowed for an analyst,
            never for an agent.
        evidence_event_ids:
          type: array
          description: >-
            The cited events. All belong to the same investigation — the
            database enforces it, so a claim cannot lean on another case's data.
          items: { type: string, format: uuid }
        metadata:
          type: object
          description: Producer-specific extras, e.g. which rule field matched.
          additionalProperties: true
        version:
          type: integer
          description: >-
            Bumped on every change. Send the value you last read when reviewing;
            a mismatch means someone else got there first.
        created_at:
          type: string
          format: date-time
          description: When the edge was created.
        updated_at:
          type: string
          format: date-time
          description: When it last changed — in practice, when it was reviewed.

    EdgeCreate:
      type: object
      description: A relation the analyst asserts between two existing nodes.
      required: [source_node_id, target_node_id, relation_code]
      properties:
        source_node_id:
          type: string
          format: uuid
          description: Node the relation starts from.
        target_node_id:
          type: string
          format: uuid
          description: Node it points to.
        relation_code:
          type: string
          description: >-
            Relation from the dictionary. Its declared endpoint kinds must match
            the two nodes, otherwise the request is rejected.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Optional degree of certainty. A manual edge is normally certain.
        why:
          type: string
          description: Justification, for the record. Optional here, required of agents.
        evidence_event_ids:
          type: array
          description: >-
            Events backing the claim. Each must belong to this investigation —
            citing another case's event is refused.
          items: { type: string, format: uuid }

    EdgePatch:
      type: object
      description: >-
        Fields to change on one edge. Anything omitted stays as it is; `version`
        is always required so two reviewers cannot overwrite each other.
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
          description: Version the client last read. A mismatch is a 409.
        status:
          allOf: [{ $ref: '../shared/enums.yaml#/components/schemas/EdgeStatus' }]
          description: >-
            Accept or rule out the claim. Rejecting requires a reason alongside.
        reject_reason:
          type: string
          description: Why it does not hold. Required when rejecting.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Revised degree of certainty.
        why:
          type: string
          description: Revised justification.
        metadata:
          type: object
          description: Replaces the stored extras wholesale, not merged into them.
          additionalProperties: true

    NodePage:
      type: object
      description: One page of nodes.
      required: [items]
      properties:
        items:
          type: array
          description: The nodes on this page.
          items: { $ref: '#/components/schemas/GraphNode' }
        next_cursor:
          type: string
          nullable: true
          description: Pass as `cursor` to get the next page. Absent on the last page.

    EdgePage:
      type: object
      description: One page of edges.
      required: [items]
      properties:
        items:
          type: array
          description: The edges on this page.
          items: { $ref: '#/components/schemas/Edge' }
        next_cursor:
          type: string
          nullable: true
          description: Pass as `cursor` to get the next page. Absent on the last page.

    EdgeEvidence:
      type: object
      description: The events an edge cites, in full rather than as bare ids.
      required: [edge_id, items]
      properties:
        edge_id:
          type: string
          format: uuid
          description: The edge these events support.
        items:
          type: array
          description: >-
            The cited events, oldest first. Each carries the link back to its
            source console.
          items: { $ref: '#/components/schemas/EvidenceEvent' }

    EvidenceEvent:
      type: object
      description: >-
        A cited event, trimmed to what a provenance panel shows. The full record
        is one request away.
      required: [event_id, source_code, source_event_id, event_type, occurred_at]
      properties:
        event_id:
          type: string
          format: uuid
          description: The event.
        source_code:
          type: string
          description: Which tool it came from.
        source_event_id:
          type: string
          description: Its identifier in that tool.
        source_ref:
          type: string
          nullable: true
          description: Link that opens the record in the source console.
        event_type:
          type: string
          description: What happened, in the product's vocabulary.
        occurred_at:
          type: string
          format: date-time
          description: When it happened, per the source.

    EdgeEvidenceAdd:
      type: object
      description: Events to cite in support of an existing edge.
      required: [event_ids]
      properties:
        event_ids:
          type: array
          minItems: 1
          description: >-
            Events to add. All must belong to the same investigation as the
            edge. Ones already cited are ignored.
          items: { type: string, format: uuid }

    ReviewRequest:
      type: object
      description: >-
        Edges to accept and edges to rule out, applied as one transaction.
        At least one of the two lists must be non-empty.
      properties:
        confirm:
          type: array
          description: Edges the analyst accepts as established.
          items:
            type: object
            required: [id, version]
            properties:
              id:
                type: string
                format: uuid
                description: The edge.
              version:
                type: integer
                description: Version the client last saw. Guards against a concurrent edit.
        reject:
          type: array
          description: >-
            Edges the analyst rules out. They are kept, not deleted — a checked
            and excluded lead is a result too.
          items:
            type: object
            required: [id, version, reason]
            properties:
              id:
                type: string
                format: uuid
                description: The edge.
              version:
                type: integer
                description: Version the client last saw.
              reason:
                type: string
                description: >-
                  Why it does not hold. Required — an unexplained rejection is
                  worthless in the report.

    ReviewResult:
      type: object
      description: Ids the batch actually changed, split by outcome.
      required: [confirmed, rejected]
      properties:
        confirmed:
          type: array
          description: Edges that became confirmed.
          items: { type: string, format: uuid }
        rejected:
          type: array
          description: Edges that became rejected.
          items: { type: string, format: uuid }
