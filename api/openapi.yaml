openapi: 3.0.3
info:
  title: Sb0rka Investigations API
  version: 0.0.1
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  description: REST API for SOC investigations and their evidence graphs.
servers:
  - url: /api/v1
security:
  - bearerAuth: []

tags:
  - name: investigations
    description: Cases and nested hypotheses.
  - name: events
    description: Project events and their investigation links.
  - name: entities
    description: Project entities extracted from events or added by analysts.
  - name: graph
    description: Investigation graph nodes, edges and evidence.
  - name: reference
    description: Entity types, relations and configured sources.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Access token issued by sb0rka auth. X-Project-ID selects the project;
        the subject must have an IR role in it.
