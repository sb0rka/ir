services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-irdev}
      POSTGRES_DB: investigations
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      # Монтируется /var/lib/postgresql, а не .../data: в образах 18+ данные
      # лежат в подкаталоге, и монтирование вглубь роняет контейнер на старте.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d investigations"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Одноразовый прогон миграций: контейнер завершается после применения.
  migrate:
    image: postgres:18
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-irdev}
    volumes:
      - ./db/migrations/investigations:/migrations:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        for f in $$(ls /migrations/*.sql | sort); do
          version=$$(basename "$$f" .sql)
          applied=$$(psql -h postgres -U postgres -d investigations -tAc "SELECT 1 FROM inv.schema_versions WHERE version = '$$version'" 2>/dev/null || true)
          if [ "$$applied" = "1" ]; then
            echo "пропускаю $$version"
            continue
          fi
          echo "применяю $$version"
          psql -h postgres -U postgres -d investigations -v ON_ERROR_STOP=1 -f "$$f"
          # Журнал появляется только на 001, поэтому отметка про 000 не запишется:
          # его повторное применение безвредно (IF NOT EXISTS).
          psql -h postgres -U postgres -d investigations -tAc "INSERT INTO inv.schema_versions (version) VALUES ('$$version') ON CONFLICT (version) DO NOTHING" >/dev/null 2>&1 || true
        done

  ir-api:
    build:
      context: .
      dockerfile: apps/investigations/Dockerfile
      args:
        BINARY: ir-api
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      SERVER_ADDR: "0.0.0.0"
      SERVER_PORT: "8090"
      SERVER_CORS_WHITELIST: "${SERVER_CORS_WHITELIST:-http://localhost:5173,http://localhost:3000}"
      DATABASE_URI: "postgres://postgres:${POSTGRES_PASSWORD:-irdev}@postgres:5432/investigations?search_path=inv"
      LOG_FORMAT: "json"
      # Публичный ключ платформы. Без него сервис поднимется,
      # но любой запрос с токеном получит 401 — конфиг стенда неполон.
      ACCESS_TOKEN_PUBLIC_KEY_FILE_PATH: "${ACCESS_TOKEN_PUBLIC_KEY_FILE_PATH:-}"
      ACCESS_TOKEN_ISSUER: "${ACCESS_TOKEN_ISSUER:-auth.local}"
      ACCESS_TOKEN_AUDIENCE: "${ACCESS_TOKEN_AUDIENCE:-api.local}"
      ACCESS_TOKEN_KID: "${ACCESS_TOKEN_KID:-ed25519-v1}"
    ports:
      - "${API_PORT:-8090}:8090"
    volumes:
      - ./keys:/keys:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/readyz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      SERVER_ADDR: "0.0.0.0"
      SERVER_PORT: "8091"
      SERVER_CORS_WHITELIST: "${SERVER_CORS_WHITELIST:-http://localhost:5173,http://localhost:3000}"
      AUTH_DISABLED: "true"
      DATABASE_URI: "postgres://postgres:${POSTGRES_PASSWORD:-irdev}@postgres:5432/investigations?search_path=inv"
      PROJECT_SOURCE_ALLOWLISTS: '{"abcdef1234":["maxpatrol-siem","pt-sandbox"]}'
      LOG_FORMAT: "json"
      MOCK_EVENT_COUNT: "${GATEWAY_MOCK_EVENT_COUNT:-50000}"
      MOCK_ENDPOINT_COUNT: "${GATEWAY_MOCK_ENDPOINT_COUNT:-5000}"
      MOCK_HISTORY_DAYS: "${GATEWAY_MOCK_HISTORY_DAYS:-90}"
    ports:
      - "${GATEWAY_PORT:-8091}:8091"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8091/readyz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5


volumes:
  pgdata:
